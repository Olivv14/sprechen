<style>
:root{
  --bg:#0E1116; --elev:#161B22; --card:#1A2029; --ink:#E8EAED; --muted:#8B919C;
  --line:#2A303A; --accent:#E8B86D; --on:#0E1116; --ok:#3D9B6E; --bad:#C45C4A;
  --radius:16px; --touch:48px;
}
html[data-theme="berlin"]{ --bg:#0B1220; --elev:#132038; --card:#17263F; --accent:#7EB6FF; --on:#0B1220; }
html[data-theme="stone"]{ --bg:#121212; --elev:#1C1C1C; --card:#222; --accent:#C4B8A5; --ink:#EEE; --muted:#9A958C; --line:#333; --on:#121212; }
html[data-theme="afterhours"]{ --bg:#140C12; --elev:#1E121A; --card:#261820; --accent:#E07A9A; --on:#140C12; }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  font-size:16px;line-height:1.45}
body{background:radial-gradient(900px 420px at 50% -20%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 55%), var(--bg)}
button,input{font:inherit;color:inherit} button{cursor:pointer}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px 112px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.brand b{display:block;font-size:1.28rem;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:1.05rem}
.lede{color:var(--muted);margin:0 0 10px}
.isle{display:grid;gap:10px}
.isle button{
  text-align:left;border:1px solid var(--line);border-radius:18px;min-height:72px;
  padding:14px 16px;background:var(--card);color:var(--ink);
  background-image:linear-gradient(135deg, color-mix(in srgb, var(--tint, var(--accent)) 22%, transparent), transparent 60%);
}
.isle button b{display:block;font-size:1.05rem}
.isle button span{color:var(--muted);font-size:.86rem}
.isle button[disabled]{opacity:.38}
.btn{border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:var(--touch);
  font-weight:650;background:var(--elev);text-align:left;width:100%}
.btn.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.ghost{background:transparent}
.row{display:flex;flex-direction:column;gap:8px}
.ans{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--elev)}
.ph{color:var(--muted);font-size:.9rem;margin:6px 0}
.de{font-weight:700;font-size:1.2rem}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:color-mix(in srgb, var(--bg) 92%, black);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{border:0;background:transparent;color:var(--muted);min-height:48px;border-radius:12px;font-size:.68rem;font-weight:700}
.nav button.on{color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted)}
.dot.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.npc{font-size:3.2rem;text-align:center;line-height:1;margin:8px 0;animation:bob 2.4s ease-in-out infinite}
.npc.yes{animation:pop .4s ease}
.npc.no{animation:shake .35s ease}
.bub{background:var(--ink);color:var(--bg);border-radius:16px 16px 16px 4px;padding:12px 14px;font-weight:700}
.stars{color:var(--accent);letter-spacing:.12em}
.xpbar{height:8px;background:var(--elev);border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--accent);width:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:24px}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

": "Tarjeta.", "ph": "KAR-tuh BIT-tuh", "why": "Karte.", "lang": "de"}, {"hear": null, "say": "Trinkgeld ist drin. Passt.", "en": "Tip's included. Fine.", "es": "La propina va incluida.", "ph": "TRINK-gelt ist drin", "why": "drin.", "lang": "de"}, {"hear": null, "say": "Gute Nacht. Kommt gut heim.", "en": "Night. Get home safe.", "es": "Buenas. Llegad bien.", "ph": "GOO-tuh nakht komt goot hym", "why": "heim.", "lang": "de"}]}]}, {"track": "de", "cefr": "A2", "unit": "change", "lessons": [{"id": "ch1", "title": "Umsteigen A2", "es": "Transbordo A2", "npc": "🔄", "kind": "new", "items": [{"hear": null, "say": "Ich muss in Ostkreuz umsteigen.", "en": "I have to change at Ostkreuz.", "es": "Transbordo en Ostkreuz.", "ph": "ij muss in OST-kroyts UM-shty-gen", "why": "Ostkreuz.", "lang": "de"}, {"hear": null, "say": "Richtung Spandau oder Warschauer?", "en": "Direction Spandau or Warschauer?", "es": "¿Spandau o Warschauer?", "ph": "RIKH-toong SHPAN-dow O-der VAR-show-er", "why": "Richtung.", "lang": "de"}, {"hear": null, "say": "Die nächste ist meine.", "en": "The next one is mine.", "es": "La siguiente es la mía.", "ph": "dee NEKH-ste ist MY-ne", "why": "meine.", "lang": "de"}, {"hear": null, "say": "Steig nicht zu früh aus.", "en": "Don't get off too early.", "es": "No te bajes pronto.", "ph": "shtykh nikht tsoo frue ows", "why": "aussteigen.", "lang": "de"}, {"hear": null, "say": "Da ist die S3. Lauf.", "en": "There's the S3. Run.", "es": "Ahí está la S3. Corre.", "ph": "da ist dee es-dry lowf", "why": "Lauf.", "lang": "de"}]}, {"id": "ch2", "title": "Falsche Linie", "es": "Línea mala", "npc": "😬", "kind": "new", "items": [{"hear": null, "say": "Das ist die falsche Linie.", "en": "This is the wrong line.", "es": "Esta es la línea mala.", "ph": "das ist dee FAL-shuh LEE-nee-e", "why": "falsche.", "lang": "de"}, {"hear": null, "say": "Wir fahren nach Norden, nicht Kreuzberg.", "en": "We're going north, not Kreuzberg.", "es": "Vamos al norte.", "ph": "veer FAH-ren nakh NO ot dan SHLEE-sen veer den kawl", "why": "schließen.", "lang": "de"}]}]}, {"track": "de", "cefr": "B1", "unit": "dinner", "lessons": [{"id": "dn1", "title": "Vorstellen", "es": "Presentarse", "npc": "🍷", "kind": "new", "items": [{"hear": null, "say": "Ich bin Oliver, ich arbeite bei Saikan.", "en": "I'm Oliver, I work at Saikan.", "es": "Soy Oliver, trabajo en Saikan.", "ph": "ij bin Oliver ij ar-BYE-tuh bye ZAI-kan", "why": "dinner Vienna energy.", "lang": "de"}, {"hear": null, "say": "Wir bauen Software für Teams, die reisen.", "en": "We build software for teams that travel.", "es": "Hacemos software para equipos que viajan.", "ph": "veer BOW-en ZOF-tware fuer teems dee RY-zen", "why": "bauen.", "lang": "de"}, {"hear": null, "say": "Und Sie? Was machen Sie genau?", "en": "And you? What do you do exactly?", "es": "¿Y usted? ¿Qué hace?", "ph": "unt zee vas MAKH-en zee ge-NOW", "why": "Sie investors.", "lang": "de"}, {"hear": null, "say": "Klingt spannend. Ehrlich.", "en": "Sounds exciting. Honestly.", "es": "Suena bien. De verdad.", "ph": "klingt SHPAN-ent AIR-likh", "why": "spannend.", "lang": "de"}, {"hear": null, "say": "Prost. Auf die Zusammenarbeit.", "en": "Cheers. To working together.", "es": "Salud. Por trabajar juntos.", "ph": "prohst owf dee tsoo-ZAM-en-ar-byt", "why": "Zusammenarbeit.", "lang": "de"}]}, {"id": "dn2", "title": "Essen reden", "es": "Hablar de comida", "npc": "🍽️", "kind": "new", "items": [{"hear": null, "say": "Was nimmst du? Ich kenn' die Karte nicht.", "en": "What are you having? I don't know the menu.", "es": "¿Qué pides? No conozco la carta.", "ph": "vas nimst doo ij ken dee KAR-tuh nikht", "why": "kennen.", "lang": "de"}, {"hear": null, "say": "Das Wiener Schnitzel ist sicher.", "en": "The schnitzel is safe.", "es": "El schnitzel es lo seguro.", "ph": "das VEE-ner SHNIT-sel ist ZI-kher", "why": "sicher.", "lang": "de"}, {"hear": null, "say": "Ich ess kein Schwein. Fisch geht.", "en": "I don't eat pork. Fish is fine.", "es": "No como cerdo. Pescado sí.", "ph": "ij es kine shvine fish gayt", "why": "Schwein.", "lang": "de"}, {"hear": null, "say": "Wein? Ein Glas, mehr nicht. Morgen Call.", "en": "Wine? One glass, no more. Call tomorrow.", "es": "¿Vino? Una copa.", "ph": "vine ine glahs mair nikht", "why": "mehr nicht.", "lang": "de"}, {"hear": null, "say": "Das war gut. Wirklich.", "en": "That was good. Really.", "es": "Estuvo bueno. De verdad.", "ph": "das var goot VEERK-likh", "why": "wirklich.", "lang": "de"}]}, {"id": "dn3", "title": "Nicht nur Business", "es": "No solo business", "npc": "😌", "kind": "new", "items": [{"hear": null, "say": "Genug Arbeit. Wie lange sind Sie in Wien?", "en": "Enough work. How long are you in Vienna?", "es": "Basta de curro. ¿Cuánto en Viena?", "ph": "ge-NOOK ar-byt vee LANG-uh zint zee in veen", "why": "Wien.", "lang": "de"}, {"hear": null, "say": "Zwei Nächte. Dann Berlin.", "en": "Two nights. Then Berlin.", "es": "Dos noches. Luego Berlín.", "ph": "tsvy NEKH-te dan ber-LEEN", "why": "dann.", "lang": "de"}, {"hear": null, "say": "Kennen Sie Dresden? Regen, aber schön.", "en": "Do you know Dresden? Rain, but beautiful.", "es": "¿Conoce Dresde? Lluvia, pero bonito.", "ph": "KEN-en zee DRAYS-den RAY-gen ah-ber shern", "why": "aber.", "lang": "de"}, {"hear": null, "say": "Ich zeig Ihnen Berlin, wenn Sie kommen.", "en": "I'll show you Berlin if you come.", "es": "Te muestro Berlín si vienes.", "ph": "ij tsaik EE-nen ber-LEEN ven zee KOM-en", "why": "Ihnen.", "lang": "de"}, {"hear": null, "say": "Gern. Wir bleiben in Kontakt.", "en": "Gladly. We'll stay in touch.", "es": "Con gusto. Seguimos.", "ph": "gern veer BLY-ben in kon-TAKT", "why": "bleiben.", "lang": "de"}]}, {"id": "dn4", "title": "Zahlen Dinner", "es": "Pagar cena", "npc": "💳", "kind": "new", "items": [{"hear": null, "say": "Die Rechnung geht auf uns.", "en": "The bill's on us.", "es": "La cuenta la ponemos nosotros.", "ph": "dee REKH-noong gayt owf uns", "why": "auf uns.", "lang": "de"}, {"hear": null, "say": "Das müssen Sie nicht.", "en": "You don't have to.", "es": "No hace falta.", "ph": "das MUE-sen zee nikht", "why": "müssen Sie nicht.", "lang": "de"}, {"hear": null, "say": "Doch. Sie sind unsere Gäste.", "en": "Yes we do. You're our guests.", "es": "Sí. Sois invitados.", "ph": "dokh zee zint UN-ze-re GES-tuh", "why": "Gäste.", "lang": "de"}, {"hear": null, "say": "Karte. Eine Quittung für Saikan.", "en": "Card. A receipt for Saikan.", "es": "Tarjeta. Ticket para Saikan.", "ph": "KAR-tuh EYE-ne KVIT-toong fuer ZAI-kan", "why": "Quittung.", "lang": "de"}, {"hear": null, "say": "Guten Heimweg. Bis zum Call.", "en": "Get home safe. Until the call.", "es": "Buen camino. Hasta la call.", "ph": "GOO-ten HYM-vayk bis tsoom kawl", "why": "Heimweg.", "lang": "de"}]}]}, {"track": "de", "cefr": "B1", "unit": "split", "lessons": [{"id": "sp1", "title": "Getrennt", "es": "Separado", "npc": "🧾", "kind": "new", "items": [{"hear": null, "say": "Können wir getrennt zahlen?", "en": "Can we pay separately?", "es": "¿Podemos pagar separado?", "ph": "KERN-en veer ge-TRENT TSAH-len", "why": "getrennt.", "lang": "de"}, {"hear": null, "say": "Drei Gerichte auf mich, der Rest auf ihn.", "en": "Three dishes on me, the rest on him.", "es": "Tres platos yo, el resto él.", "ph": "dry ge-RIKH-tuh owf mikh dair rest owf een", "why": "auf mich.", "lang": "de"}, {"hear": null, "say": "Kein Stress, wir kennen uns.", "en": "No stress, we know each other.", "es": "Sin estrés, nos conocemos.", "ph": "kine shtress veer KEN-en uns", "why": "kennen uns.", "lang": "de"}, {"hear": null, "say": "Trinkgeld zehn Prozent, oder?", "en": "Ten percent tip, right?", "es": "¿Diez por ciento?", "ph": "TRINK-gelt tsayn pro-TSENT", "why": "Prozent.", "lang": "de"}, {"hear": null, "say": "Passt. Danke fürs Essen.", "en": "Fine. Thanks for dinner.", "es": "Vale. Gracias por la cena.", "ph": "past DANG-kuh fuers ES-en", "why": "fürs.", "lang": "de"}]}, {"id": "sp2", "title": "Ich lade", "es": "Invito yo", "npc": "🎁", "kind": "new", "items": [{"hear": null, "say": "Heute lade ich dich ein. Kein Streit.", "en": "Today I'm buying. No argument.", "es": "Hoy invito. Sin pelea.", "ph": "HOY-tuh LAH-duh ij dikh ine kine shtrite", "why": "einladen.", "lang": "de"}, {"hear": null, "say": "Nächstes Mal du. Versprochen.", "en": "Next time you. Promised.", "es": "La próxima tú.", "ph": "NEKH-stes mahl doo fer-SHPROKH-en", "why": "nächstes Mal.", "lang": "de"}, {"hear": null, "say": "Dann akzeptier ich's. Danke.", "en": "Then I'll take it. Thanks.", "es": "Entonces acepto.", "ph": "dan a-tsep-TEER ikhs", "why": "akzeptieren.", "lang": "de"}, {"hear": null, "say": "War gut, mit dir zu reden.", "en": "It was good talking with you.", "es": "Estuvo bien hablar.", "ph": "var goot mit deer tsoo RAY-den", "why": "mit dir.", "lang": "de"}, {"hear": null, "say": "U-Bahn oder zu Fuß?", "en": "U-Bahn or walk?", "es": "¿Metro o a pie?", "ph": "OO-bahn O-der tsoo foos", "why": "oder.", "lang": "de"}]}, {"id": "sp3", "title": "Fehler Kellner", "es": "Error camarero", "npc": "😕", "kind": "new", "items": [{"hear": null, "say": "Das ist nicht unsere Rechnung.", "en": "That's not our bill.", "es": "Esa no es nuestra cuenta.", "ph": "das ist nikht UN-ze-re REKH-noong", "why": "unsere.", "lang": "de"}, {"hear": null, "say": "Wir hatten kein Wein, nur Wasser.", "en": "We had no wine, just water.", "es": "No pedimos vino, solo agua.", "ph": "veer HAT-ten kine vine noor VAS-ser", "why": "hatten.", "lang": "de"}, {"hear": null, "say": "Können Sie das bitte prüfen?", "en": "Can you check that please?", "es": "¿Lo revisa?", "ph": "KERN-en zee das BIT-tuh PRUE-fen", "why": "prüfen ü.", "lang": "de"}, {"hear": null, "say": "Stimmt, sorry. Neue Rechnung.", "en": "You're right, sorry. New bill.", "es": "Es verdad. Cuenta nueva.", "ph": "shtimt sori NOY-uh REKH-noong", "why": "stimmt.", "lang": "de"}, {"hear": null, "say": "Kein Problem. Passiert.", "en": "No problem. Happens.", "es": "Sin problema. Pasa.", "ph": "kine pro-BLAYM pa-SEERT", "why": "passiert.", "lang": "de"}]}, {"id": "sp4", "title": "App teilen", "es": "App split", "npc": "📱", "kind": "new", "items": [{"hear": null, "say": "Ich schick dir den Split in der App.", "en": "I'll send you the split in the app.", "es": "Te mando el split en la app.", "ph": "ij shik deer den split in dair ap", "why": "schick dir.", "lang": "de"}, {"hear": null, "say": "Zwölf Euro, oder?", "en": "Twelve euros, right?", "es": "¿Doce euros?", "ph": "tsvelf OY-ro", "why": "zwölf ö.", "lang": "de"}, {"hear": null, "say": "Ich hab aufgerundet. Passt.", "en": "I rounded up. Fine.", "es": "Redondeé. Vale.", "ph": "ij hap OWF-ge-run-det", "why": "aufrunden.", "lang": "de"}, {"hear": null, "say": "Danke, das war unkompliziert.", "en": "Thanks, that was easy.", "es": "Gracias, fue fácil.", "ph": "das var UN-kom-pli-tseert", "why": "unkompliziert.", "lang": "de"}, {"hear": null, "say": "Bis zum nächsten Essen.", "en": "Until the next meal.", "es": "Hasta la próxima.", "ph": "bis tsoom NEKH-sten ES-en", "why": "nächsten.", "lang": "de"}]}]}, {"track": "de", "cefr": "B1", "unit": "story", "lessons": [{"id": "st1", "title": "Dresden Regen", "es": "Dresde lluvia", "npc": "🌧️", "kind": "new", "items": [{"hear": null, "say": "In Dresden hat's den ganzen Tag geregnet.", "en": "In Dresden it rained all day.", "es": "En Dresde llovió todo el día.", "ph": "in DRAYS-den hats den GAN-tsen tahk ge-RAYG-net", "why": "geregnet.", "lang": "de"}, {"hear": null, "say": "Trotzdem schön, die Altstadt.", "en": "Still beautiful, the old town.", "es": "Aun así, el casco viejo.", "ph": "TROTS-dem shern dee ALT-shtat", "why": "trotzdem.", "lang": "de"}, {"hear": null, "say": "Ich war nur zwei Nächte da.", "en": "I was only there two nights.", "es": "Solo dos noches.", "ph": "ij var noor tsvy NEKH-te da", "why": "war.", "lang": "de"}, {"hear": null, "say": "Nächstes Mal länger, ohne Meeting.", "en": "Next time longer, no meeting.", "es": "La próxima más, sin meeting.", "ph": "NEKH-stes mahl LENG-er OH-ne MEE-ting", "why": "länger.", "lang": "de"}, {"hear": null, "say": "Willst du mit, irgendwann?", "en": "Want to come, sometime?", "es": "¿Te apuntas algún día?", "ph": "vilst doo mit IR-gend-van", "why": "irgendwann.", "lang": "de"}]}, {"id": "st2", "title": "Techno", "es": "Techno", "npc": "🎧", "kind": "new", "items": [{"hear": null, "say": "Gestern war ich tanzen, bis spät.", "en": "Yesterday I was dancing, late.", "es": "Ayer estuve bailando, tarde.", "ph": "GES-tern var ij TAN-tsen bis shpayt", "why": "tanzen.", "lang": "de"}, {"hear": null, "say": "Nicht Berghain. Kleiner Club.", "en": "Not Berghain. A smaller club.", "es": "No Berghain. Un club pequeño.", "ph": "nikht BERK-hine KLY-ner klub", "why": "kleiner.", "lang": "de"}, {"hear": null, "say": "Die Musik war gut, die Leute locker.", "en": "The music was good, people easy.", "es": "La música bien, la gente fácil.", "ph": "dee mu-ZEEK var goot dee LOY-tuh LOK-er", "why": "locker.", "lang": "de"}, {"hear": null, "say": "Heute bin ich müde, ehrlich.", "en": "Today I'm tired, honestly.", "es": "Hoy estoy cansado.", "ph": "HOY-tuh bin ij MUE-duh AIR-likh", "why": "müde ü.", "lang": "de"}, {"hear": null, "say": "Trotzdem Stand-up um neun.", "en": "Still standup at nine.", "es": "Igual standup a las nueve.", "ph": "TROTS-dem stand-ap um noyn", "why": "trotzdem.", "lang": "de"}]}, {"id": "st3", "title": "Italien Strand", "es": "Italia playa", "npc": "🏖️", "kind": "new", "items": [{"hear": null, "say": "In Italien hat's auch geregnet, am Strand.", "en": "In Italy it rained at the beach too.", "es": "En Italia también llovió en la playa.", "ph": "in ee-TAH-lee-en hats oukh ge-RAYG-net am shtrant", "why": "Strand.", "lang": "de"}, {"hear": null, "say": "Trotzdem ins Wasser. Kalt, aber gut.", "en": "Still went in. Cold, but good.", "es": "Igual al agua. Fría, pero bien.", "ph": "TROTS-dem ins VAS-ser kalt ah-ber goot", "why": "ins Wasser.", "lang": "de"}, {"hear": null, "say": "Ich hab kaum Italienisch, nur Hände.", "en": "I barely have Italian, just hands.", "es": "Casi no tengo italiano, solo manos.", "ph": "ij hap kowm ee-TAH-lee-nish noor HEN-duh", "why": "kaum.", "lang": "de"}, {"hear": null, "say": "Die Leute waren nett trotzdem.", "en": "People were nice anyway.", "es": "La gente fue maja igual.", "ph": "dee LOY-tuh VAH-ren net TROTS-dem", "why": "waren.", "lang": "de"}, {"hear": null, "say": "Nächstes Jahr länger. Versprochen.", "en": "Next year longer. Promised.", "es": "El año que viene más.", "ph": "NEKH-stes yahr LENG-er", "why": "Jahr.", "lang": "de"}]}, {"id": "st4", "title": "Warum Deutsch", "es": "Por qué alemán", "npc": "🇩🇪", "kind": "new", "items": [{"hear": null, "say": "Ich lerne Deutsch, weil ich hier lebe.", "en": "I learn German because I live here.", "es": "Aprendo alemán porque vivo aquí.", "ph": "ij LER-nuh doych vile ij heer LAY-buh", "why": "weil.", "lang": "de"}, {"hear": null, "say": "Nicht weil ein Buch es sagt.", "en": "Not because a book says so.", "es": "No porque un libro lo diga.", "ph": "nikht vile ine bookh es zahkt", "why": "weil + Buch.", "lang": "de"}, {"hear": null, "say": "Ich will mit Leuten reden, nicht tippen.", "en": "I want to talk to people, not tap.", "es": "Quiero hablar con gente, no pulsar.", "ph": "ij vil mit LOY-ten RAY-den nikht TIP-en", "why": "reden.", "lang": "de"}, {"hear": null, "say": "Manchmal peinlich, meistens okay.", "en": "Sometimes awkward, mostly okay.", "es": "A veces cutre, casi siempre ok.", "ph": "MANCH-mal PYNE-likh MY-stens", "why": "peinlich.", "lang": "de"}, {"hear": null, "say": "Heute war gut. Danke, dass du zuhörst.", "en": "Today was good. Thanks for listening.", "es": "Hoy fue bien. Gracias por escuchar.", "ph": "HOY-tuh var goot das doo TSOO-herst", "why": "zuhören.", "lang": "de"}]}]}, {"track": "de", "cefr": "B1", "unit": "phone", "lessons": [{"id": "ph1", "title": "Wer spricht", "es": "Quién habla", "npc": "📞", "kind": "new", "items": [{"hear": null, "say": "Hallo, hier ist Oliver von Saikan.", "en": "Hi, this is Oliver from Saikan.", "es": "Hola, Oliver de Saikan.", "ph": "HAL-lo heer ist Oliver fon ZAI-kan", "why": "hier ist.", "lang": "de"}, {"hear": null, "say": "Spreche ich mit Frau Berger?", "en": "Am I speaking with Ms Berger?", "es": "¿Hablo con la Sra. Berger?", "ph": "SHPREKH-uh ij mit frow BER-ger", "why": "Frau + Sie world.", "lang": "de"}, {"hear": null, "say": "Ich rufe wegen unseres Calls zurück.", "en": "I'm calling back about our call.", "es": "Devuelvo la llamada de nuestra call.", "ph": "ij ROO-fuh VAY-gen UN-ze-res kawls tsoo-RUEK", "why": "wegen.", "lang": "de"}, {"hear": null, "say": "Ist jetzt ein schlechter Zeitpunkt?", "en": "Is this a bad time?", "es": "¿Es mal momento?", "ph": "ist yetst ine SHLEKH-ter TSITE-punkt", "why": "Zeitpunkt.", "lang": "de"}, {"hear": null, "say": "Dann rufe ich in einer Stunde an.", "en": "Then I'll call in an hour.", "es": "Llamo en una hora.", "ph": "dan ROO-fuh ij in EYE-ner SHTUN-de an", "why": "in einer Stunde.", "lang": "de"}]}, {"id": "ph2", "title": "Schlecht Verbindung", "es": "Mala conexión", "npc": "📉", "kind": "new", "items": [{"hear": null, "say": "Ich hör dich schlecht. Bist du im Zug?", "en": "I can barely hear you. Are you on the train?", "es": "Te oigo mal. ¿Vas en el tren?", "ph": "ij her dikh shlekht bist doo im tsook", "why": "hören.", "lang": "de"}, {"hear": null, "say": "Ja, ich geh raus und ruf zurück.", "en": "Yes, I'll go outside and call back.", "es": "Sí, salgo y te llamo.", "ph": "ya ij gay rows unt roof tsoo-RUEK", "why": "zurückrufen.", "lang": "de"}, {"hear": null, "say": "Kannst du kurz schreiben?", "en": "Can you text for a second?", "es": "¿Puedes escribir un momento?", "ph": "kanst doo koorts SHRY-ben", "why": "schreiben.", "lang": "de"}, {"hear": null, "say": "Netz ist tot. Später.", "en": "No signal. Later.", "es": "No hay red. Luego.", "ph": "nets ist toht SHPAY-ter", "why": "Netz.", "lang": "de"}, {"hear": null, "say": "Wieder da. Geht's jetzt?", "en": "Back. Working now?", "es": "Ya estoy. ¿Va?", "ph": "VEE-der da gayts yetst", "why": "wieder da.", "lang": "de"}]}, {"id": "ph3", "title": "Mailbox", "es": "Buzón", "npc": "📬", "kind": "new", "items": [{"hear": null, "say": "Hi, hier ist Oliver. Ruf mich bitte zurück.", "en": "Hi, Oliver. Please call me back.", "es": "Hola, Oliver. Devuélveme la llamada.", "ph": "heer ist Oliver roof mikh BIT-tuh tsoo-RUEK", "why": "zurückrufen.", "lang": "de"}, {"hear": null, "say": "Es geht um den Termin morgen früh.", "en": "It's about the appointment tomorrow morning.", "es": "Es por la cita de mañana.", "ph": "es gayt um den ter-MEEN MOR-gen frue", "why": "Termin.", "lang": "de"}, {"hear": null, "say": "Meine Nummer hast du. Bis dann.", "en": "You've got my number. Speak soon.", "es": "Tienes mi número.", "ph": "MY-ne NUM-er hast doo bis dan", "why": "hast du.", "lang": "de"}, {"hear": null, "say": "Falls ich nicht rangehe, WhatsApp.", "en": "If I don't pick up, WhatsApp.", "es": "Si no cojo, WhatsApp.", "ph": "fals ij nikht RAN-gay vats-ap", "why": "rangehen.", "lang": "de"}, {"hear": null, "say": "Danke, tschüss.", "en": "Thanks, bye.", "es": "Gracias, ciao.", "ph": "DANG-kuh chuess", "why": "tschüss.", "lang": "de"}]}, {"id": "ph4", "title": "Bestätigen", "es": "Confirmar", "npc": "✅", "kind": "new", "items": [{"hear": null, "say": "Ich wollt's nur bestätigen: morgen um neun.", "en": "Just confirming: tomorrow at nine.", "es": "Solo confirmo: mañana a las nueve.", "ph": "ij voltes noor be-SHTEH-ti-gen MOR-gen um noyn", "why": "bestätigen.", "lang": "de"}, {"hear": null, "say": "Bei euch im Büro, nicht online.", "en": "At your office, not online.", "es": "En vuestra oficina, no online.", "ph": "bye oykh im BUE-ro nikht on-line", "why": "Büro ü.", "lang": "de"}, {"hear": null, "say": "Ich bring den Laptop mit.", "en": "I'll bring the laptop.", "es": "Llevo el portátil.", "ph": "ij bring den LAP-top mit", "why": "mitbringen.", "lang": "de"}, {"hear": null, "say": "Wenn sich was ändert, SMS reicht.", "en": "If anything changes, SMS is enough.", "es": "Si cambia, un SMS vale.", "ph": "ven zikh vas EN-dert es-em-es rykht", "why": "reicht.", "lang": "de"}, {"hear": null, "say": "Super. Bis morgen.", "en": "Great. Until tomorrow.", "es": "Hasta mañana.", "ph": "ZOO-per bis MOR-gen", "why": "bis morgen.", "lang": "de"}]}]}, {"track": "de", "cefr": "B2", "unit": "deal", "lessons": [{"id": "dl1", "title": "Angebot", "es": "Oferta", "npc": "📑", "kind": "new", "items": [{"hear": null, "say": "Aus unserer Sicht ist der Preis zu hoch.", "en": "From our side the price is too high.", "es": "Para nosotros el precio es alto.", "ph": "ows UN-ze-rer zikht ist dair prys tsoo hohkh", "why": "aus unserer Sicht.", "lang": "de"}, {"hear": null, "say": "Wäre es möglich, zehn Prozent zu gehen?", "en": "Would it be possible to go ten percent?", "es": "¿Se podría bajar un diez?", "ph": "VAIR-uh es MERG-likh tsayn pro-TSENT tsoo GAY-en", "why": "wäre.", "lang": "de"}, {"hear": null, "say": "Nicht weil wir geizig sind, der Scope ist kleiner.", "en": "Not because we're cheap, the scope is smaller.", "es": "No somos tacaños, el scope es menor.", "ph": "nikht vile veer GY-tsikh zint dair skohp ist KLY-ner", "why": "Scope.", "lang": "de"}, {"hear": null, "say": "Lassen Sie uns eine Mitte finden.", "en": "Let's find a middle.", "es": "Busquemos un punto medio.", "ph": "LAS-en zee uns EYE-ne MIT-tuh FIN-den", "why": "lassen Sie uns.", "lang": "de"}, {"hear": null, "say": "Wenn das geht, haben wir einen Deal.", "en": "If that works, we have a deal.", "es": "Si eso va, hay trato.", "ph": "ven das gayt HAB-en veer EYE-nen deel", "why": "Deal.", "lang": "de"}]}, {"id": "dl2", "title": "Zeit", "es": "Plazo", "npc": "⏳", "kind": "new", "items": [{"hear": null, "say": "Ende des Monats ist sportlich.", "en": "End of the month is tight.", "es": "Fin de mes está justo.", "ph": "EN-de des MO-nats ist SHPORT-likh", "why": "sportlich = ambitious/tight.", "lang": "de"}, {"hear": null, "say": "Mitte nächsten Monats wäre ehrlich.", "en": "Mid next month would be honest.", "es": "Mediados del mes que viene sería honesto.", "ph": "MIT-tuh NEKH-sten MO-nats VAIR-uh AIR-likh", "why": "wäre.", "lang": "de"}, {"hear": null, "say": "Wir wollen nicht versprechen, was wir nicht halten.", "en": "We don't want to promise what we won't keep.", "es": "No prometemos lo que no cumplimos.", "ph": "veer VOL-en nikht fer-SHPREKH-en vas veer nikht HAL-ten", "why": "halten.", "lang": "de"}, {"hear": null, "say": "Können wir den Kickoff verschieben?", "en": "Can we move the kickoff?", "es": "¿Movemos el kickoff?", "ph": "KERN-en veer den kik-of fer-SHEE-ben", "why": "verschieben.", "lang": "de"}, {"hear": null, "say": "Dann sind wir uns einig.", "en": "Then we're agreed.", "es": "Entonces estamos de acuerdo.", "ph": "dan zint veer uns EYE-nikh", "why": "einig.", "lang": "de"}]}, {"id": "dl3", "title": "Nein sagen", "es": "Decir no", "npc": "🚫", "kind": "new", "items": [{"hear": null, "say": "Das können wir so nicht liefern.", "en": "We can't deliver it like that.", "es": "Así no lo podemos entregar.", "ph": "das KERN-en veer zo nikht LEE-fern", "why": "liefern.", "lang": "de"}, {"hear": null, "say": "Nicht weil wir keine Lust haben.", "en": "Not because we don't feel like it.", "es": "No porque no nos apetezca.", "ph": "nikht vile veer kine loost HAB-en", "why": "Lust.", "lang": "de"}, {"hear": null, "say": "Die Qualität würde leiden, und das wollen wir nicht.", "en": "Quality would suffer, and we don't want that.", "es": "La calidad sufriría.", "ph": "dee kvah-lee-TET VUER-de LY-den", "why": "würde.", "lang": "de"}, {"hear": null, "say": "Ein kleinerer Scope geht. Alles auf einmal nicht.", "en": "A smaller scope works. Everything at once doesn't.", "es": "Un scope menor sí. Todo a la vez no.", "ph": "ine KLY-ne-rer skohp gayt AL-les owf INE-mahl nikht", "why": "auf einmal.", "lang": "de"}, {"hear": null, "say": "Ich will lieber ehrlich sein als später stressen.", "en": "I'd rather be honest than stressed later.", "es": "Prefiero ser honesto.", "ph": "ij vil LEE-ber AIR-likh zine als SHPAY-ter SHTres-en", "why": "lieber als.", "lang": "de"}]}, {"id": "dl4", "title": "Handschlag", "es": "Apretón", "npc": "🤝", "kind": "new", "items": [{"hear": null, "say": "Dann halten wir das fest.", "en": "Then let's lock that in.", "es": "Entonces lo dejamos cerrado.", "ph": "dan HAL-ten veer das fest", "why": "festhalten.", "lang": "de"}, {"hear": null, "say": "Ich schick heute noch die Mail.", "en": "I'll send the email still today.", "es": "Hoy mando el mail.", "ph": "ij shik HOY-tuh nokh dee mail", "why": "heute noch.", "lang": "de"}, {"hear": null, "say": "Wenn der Text passt, unterschreiben wir.", "en": "If the text is fine, we sign.", "es": "Si el texto encaja, firmamos.", "ph": "ven dair tekst past UN-ter-shry-ben veer", "why": "unterschreiben.", "lang": "de"}, {"hear": null, "say": "Freut mich, ehrlich.", "en": "I'm glad, honestly.", "es": "Me alegra, de verdad.", "ph": "froyt mikh AIR-likh", "why": "freut mich.", "lang": "de"}, {"hear": null, "say": "Auf gute Arbeit.", "en": "To good work.", "es": "Por buen trabajo.", "ph": "owf GOO-tuh ar-byt", "why": "Auf.", "lang": "de"}]}]}, {"track": "de", "cefr": "B2", "unit": "irony", "lessons": [{"id": "ir1", "title": "Ja klar", "es": "Ya claro", "npc": "😏", "kind": "new", "items": [{"hear": null, "say": "Ja, klar. Pünktlich wie die Bahn.", "en": "Yeah, sure. Punctual like the train.", "es": "Sí, claro. Puntual como el tren.", "ph": "ya klar PUENKT-likh vee dee bahn", "why": "irony, not grammar drill.", "lang": "de"}, {"hear": null, "say": "Nicht wirklich.", "en": "Not really.", "es": "No realmente.", "ph": "nikht VEERK-likh", "why": "Nicht wirklich.", "lang": "de"}, {"hear": null, "say": "Das meinte ich nicht ernst.", "en": "I didn't mean that seriously.", "es": "No lo decía en serio.", "ph": "das MYN-tuh ij nikht ayrnst", "why": "ernst.", "lang": "de"}, {"hear": null, "say": "Du merkst es, oder?", "en": "You can tell, right?", "es": "¿Se nota, no?", "ph": "doo merkst es O-der", "why": "merken.", "lang": "de"}, {"hear": null, "say": "Gut. Ich hör auf, bevor's peinlich wird.", "en": "Good. I'll stop before it gets awkward.", "es": "Paro antes de que sea cutre.", "ph": "goot ij her owf be-FORS PYNE-likh virt", "why": "bevor.", "lang": "de"}]}, {"id": "ir2", "title": "Berlin Wetter", "es": "Tiempo Berlín", "npc": "🌧️", "kind": "new", "items": [{"hear": null, "say": "Schönes Wetter. Typisch Berlin.", "en": "Nice weather. Typical Berlin.", "es": "Qué tiempo. Típico Berlín.", "ph": "SHER-nes VET-ter TUED-pish ber-LEEN", "why": "said in rain.", "lang": "de"}, {"hear": null, "say": "Ich wollt' extra ohne Jacke kommen.", "en": "I was going to come without a jacket on purpose.", "es": "Iba a venir sin chaqueta a propósito.", "ph": "ij volt EK-stra OH-ne YA-ke KOM-en", "why": "wollt'.", "lang": "de"}, {"hear": null, "say": "Hat nicht so gut geklappt.", "en": "Didn't work out so well.", "es": "No salió tan bien.", "ph": "hat nikht zo goot ge-klapt", "why": "klappen.", "lang": "de"}, {"hear": null, "say": "Nächstes Mal Regenjacke. Versprochen.", "en": "Next time a rain jacket. Promised.", "es": "La próxima chubasquero.", "ph": "NEKH-stes mahl RAY-gen-ya-ke", "why": "Regenjacke.", "lang": "de"}, {"hear": null, "say": "Oder wir bleiben im Café. Auch eine Idee.", "en": "Or we stay in the café. Also an idea.", "es": "O nos quedamos en el café.", "ph": "O-der veer BLY-ben im ka-FEH oukh EYE-ne ee-DAY", "why": "Idee.", "lang": "de"}]}, {"id": "ir3", "title": "Meeting lang", "es": "Meeting largo", "npc": "🥱", "kind": "new", "items": [{"hear": null, "say": "Nur fünf Minuten, hat er gesagt.", "en": "Just five minutes, he said.", "es": "Solo cinco minutos, dijo.", "ph": "noor fuenf mi-NOO-ten hat air ge-ZAHKT", "why": "hat gesagt.", "lang": "de"}, {"hear": null, "say": "Vor einer Stunde.", "en": "An hour ago.", "es": "Hace una hora.", "ph": "for EYE-ner SHTUN-de", "why": "vor.", "lang": "de"}, {"hear": null, "say": "Ich sag nichts. Du auch nicht.", "en": "I'm saying nothing. You neither.", "es": "No digo nada. Tú tampoco.", "ph": "ij zahk nikhts doo oukh nikht", "why": "nichts.", "lang": "de"}, {"hear": null, "say": "Wenn er 'schnell' sagt, bring Kaffee.", "en": "When he says 'quick', bring coffee.", "es": "Cuando dice rápido, lleva café.", "ph": "ven air shnel zahkt bring ka-FEH", "why": "wenn er sagt.", "lang": "de"}, {"hear": null, "say": "Okay, jetzt bin ich wieder nett.", "en": "Okay, now I'm nice again.", "es": "Vale, ya soy majo otra vez.", "ph": "yetst bin ij VEE-der net", "why": "wieder.", "lang": "de"}]}, {"id": "ir4", "title": "App perfekt", "es": "App perfecta", "npc": "📱", "kind": "new", "items": [{"hear": null, "say": "Die App ist perfekt. Deshalb lerne ich noch Deutsch.", "en": "The app is perfect. That's why I'm still learning German.", "es": "La app es perfecta. Por eso sigo con el alemán.", "ph": "dee ap ist per-FEKT DES-halb LER-nuh ij nokh doych", "why": "deshalb.", "lang": "de"}, {"hear": null, "say": "Quatsch. Die App hilft. Das Leben prüft.", "en": "Nah. The app helps. Life tests you.", "es": "Qué va. La app ayuda. La vida examina.", "ph": "kvatch dee ap hilft das LAY-ben prueft", "why": "Quatsch.", "lang": "de"}, {"hear": null, "say": "Ohne Leute bleibt's Theorie.", "en": "Without people it stays theory.", "es": "Sin gente se queda en teoría.", "ph": "OH-ne LOY-tuh blybts tay-o-REE", "why": "bleibt's.", "lang": "de"}, {"hear": null, "say": "Deshalb sitzen wir hier und nicht im Buch.", "en": "That's why we're sitting here, not in a book.", "es": "Por eso estamos aquí y no en un libro.", "ph": "DES-halb ZIT-sen veer heer unt nikht im bookh", "why": "deshalb.", "lang": "de"}, {"hear": null, "say": "Passt. Nächster Satz, ernst diesmal.", "en": "Fine. Next sentence, serious this time.", "es": "Vale. Siguiente frase, en serio.", "ph": "past NEKH-ster zats ayrnst DEES-mahl", "why": "diesmal.", "lang": "de"}]}]}, {"track": "de", "cefr": "B2", "unit": "advice", "lessons": [{"id": "ad1", "title": "An deiner Stelle", "es": "En tu lugar", "npc": "💡", "kind": "new", "items": [{"hear": null, "say": "An deiner Stelle würde ich das sagen.", "en": "In your place I'd say that.", "es": "En tu lugar yo lo diría.", "ph": "an DY-ner SHTEL-luh VUER-de ij das ZAH-gen", "why": "an deiner Stelle.", "lang": "de"}, {"hear": null, "say": "Nicht morgen. Heute, kurz, klar.", "en": "Not tomorrow. Today, short, clear.", "es": "No mañana. Hoy, corto, claro.", "ph": "nikht MOR-gen HOY-tuh koorts klar", "why": "heute.", "lang": "de"}, {"hear": null, "say": "Du musst nicht perfekt klingen.", "en": "You don't have to sound perfect.", "es": "No tienes que sonar perfecto.", "ph": "doo musst nikht per-FEKT KLING-en", "why": "musst nicht.", "lang": "de"}, {"hear": null, "say": "Nur ehrlich. Das reicht meistens.", "en": "Just honest. That's usually enough.", "es": "Solo honesto. Suele bastar.", "ph": "noor AIR-likh das rykht MY-stens", "why": "meistens.", "lang": "de"}, {"hear": null, "say": "Wenn du willst, hör ich vorher zu.", "en": "If you want, I'll listen first.", "es": "Si quieres, te escucho antes.", "ph": "ven doo vilst her ij FOR-her tsoo", "why": "vorher.", "lang": "de"}]}, {"id": "ad2", "title": "Bahn", "es": "Tren consejo", "npc": "🚇", "kind": "new", "items": [{"hear": null, "say": "Nimm die S-Bahn, nicht die U8 heute.", "en": "Take the S-Bahn, not the U8 today.", "es": "Coge la S-Bahn, no la U8 hoy.", "ph": "nim dee es-bahn nikht dee oo-akht HOY-tuh", "why": "nimm.", "lang": "de"}, {"hear": null, "say": "Störung. WhatsApp von einem Kumpel.", "en": "Disruption. WhatsApp from a mate.", "es": "Incidencia. WhatsApp de un colega.", "ph": "SHTER-roong vats-ap fon EYE-nem KUM-pel", "why": "Kumpel.", "lang": "de"}, {"hear": null, "say": "Zehn Minuten mehr, aber du kommst an.", "en": "Ten minutes more, but you'll arrive.", "es": "Diez minutos más, pero llegas.", "ph": "tsayn mi-NOO-ten mair ah-ber doo komt an", "why": "ankommen.", "lang": "de"}, {"hear": null, "say": "Taxi nur wenn's wirklich brennt.", "en": "Taxi only if it's really on fire.", "es": "Taxi solo si duele de verdad.", "ph": "TA-xee noor vens VEERK-likh brent", "why": "nur wenn.", "lang": "de"}, {"hear": null, "say": "Danke. Ich geh jetzt.", "en": "Thanks. I'm going now.", "es": "Gracias. Me voy.", "ph": "ij gay yetst", "why": "gehen.", "lang": "de"}]}, {"id": "ad3", "title": "Deutsch lernen", "es": "Aprender alemán", "npc": "📘", "kind": "new", "items": [{"hear": null, "say": "Lern keine Sätze aus dem Buch.", "en": "Don't learn sentences from the book.", "es": "No aprendas frases del libro.", "ph": "lern kine ZET-se ows dem bookh", "why": "keine Sätze.", "lang": "de"}, {"hear": null, "say": "Sag, was du heute brauchst. U-Bahn, Kaffee, Call.", "en": "Say what you need today. U-Bahn, coffee, call.", "es": "Di lo que necesitas hoy.", "ph": "zahk vas doo HOY-tuh browkhst", "why": "brauchst.", "lang": "de"}, {"hear": null, "say": "Wenn du's falsch sagst, sagt dir jemand Bescheid.", "en": "If you say it wrong, someone will tell you.", "es": "Si lo dices mal, alguien te corrige.", "ph": "ven doos falsh zahkst zahkt deer YAY-mant be-SHITE", "why": "Bescheid.", "lang": "de"}, {"hear": null, "say": "Das ist besser als zwanzig Herzen in einer App.", "en": "That's better than twenty hearts in an app.", "es": "Eso es mejor que veinte corazones.", "ph": "das ist BES-er als TSVAN-tsikh HERT-sen", "why": "besser als.", "lang": "de"}, {"hear": null, "say": "Mach weiter. Du klingst schon wie jemand, der hier lebt.", "en": "Keep going. You already sound like someone who lives here.", "es": "Sigue. Ya suenas a alguien que vive aquí.", "ph": "makh VY-ter doo klingst shohn vee YAY-mant dair heer laybt", "why": "klingen.", "lang": "de"}]}, {"id": "ad4", "title": "Nein Freund", "es": "No a un amigo", "npc": "🛑", "kind": "new", "items": [{"hear": null, "say": "Du musst nicht ja sagen, nur weil er nett ist.", "en": "You don' function trackOf(id){ return (typeof COURSE!=="undefined" && COURSE.tracks||[]).find(x=>x.id===id); }
function themeLesson(track, themeId){
  return (typeof THEMES!=="undefined" && THEMES[track]||[]).find(x=>x.id===themeId);
}
function lessonsFor(trackId, unitId){
  const out=[];
  const tr=trackOf(trackId); if(!tr) return out;
  for(const sec of tr.sections||[]){
    const u=(sec.units||[]).find(x=>x.id===unitId);
    if(u){ for(const L of u.lessons||[]) out.push(L); }
  }
  if(out.length) return out;
  const bid=(BRIDGE[trackId]||{})[unitId];
  const tm=bid && themeLesson(trackId, bid);
  if(tm && !out.some(x=>x.id===tm.id)) out.push(tm);
  if(trackId==="flirt" && unitId==="table-de"){
    const looks=themeLesson("flirt","looks");
    if(looks && !out.some(x=>x.id==="looks")) out.push(looks);
  }
  if(trackId==="de" && unitId==="bar"){
    const v=themeLesson("de","view");
    if(v && !out.some(x=>x.id==="view")) out.push(v);
  }
  return out;
}
function starsOf(track, lessonId){ return (S.sit&&S.sit[track+"."+lessonId]&&S.sit[track+"."+lessonId].stars)||0; }
function unitDone(trackId, unitId){
  const ls=lessonsFor(trackId, unitId);
  if(!ls.length) return false;
  return ls.every(L=>starsOf(trackId, L.id)>=1);
}
function liveUnits(trackId, cefr){
  const tr=trackOf(trackId); if(!tr) return [];
  const sec=(tr.sections||[]).find(s=>s.cefr===cefr);
  return (sec&&sec.units||[]).filter(u=>lessonsFor(trackId,u.id).length);
}
function sectionOpen(trackId, cefr){
  const tr=trackOf(trackId); if(!tr||!tr.live) return false;
  const secs=tr.sections||[];
  const i=secs.findIndex(s=>s.cefr===cefr);
  if(i<=0) return true;
  const prev=secs[i-1];
  const units=liveUnits(trackId, prev.cefr);
  if(!units.length) return false;
  const ok=units.filter(u=>unitDone(trackId,u.id)).length;
  return ok/units.length>=0.8;
}
function unitOpen(trackId, cefr, unitId){
  if(!sectionOpen(trackId, cefr)) return false;
  const units=liveUnits(trackId, cefr);
  const i=units.findIndex(u=>u.id===unitId);
  if(i<=0) return true;
  return unitDone(trackId, units[i-1].id);
}
function lessonOpen(trackId, cefr, unitId, lessonId){
  if(!unitOpen(trackId, cefr, unitId)) return false;
  const ls=lessonsFor(trackId, unitId);
  const i=ls.findIndex(L=>L.id===lessonId);
  if(i<=0) return true;
  return starsOf(trackId, ls[i-1].id)>=1;
}
function packStats(){
  let total=0, done=0;
  for(const tr of (typeof COURSE!=="undefined" && COURSE.tracks)||[]){
    for(const sec of tr.sections||[]){
      for(const u of sec.units||[]){
        const ls=lessonsFor(tr.id, u.id);
        total+=ls.length;
        done+=ls.filter(L=>starsOf(tr.id,L.id)>=1).length;
      }
    }
  }
  if(!total && typeof THEMES!=="undefined"){
    for(const k of Object.keys(THEMES)){
      const arr=THEMES[k]||[];
      total+=arr.length;
      done+=arr.filter(tm=>starsOf(k,tm.id)>=1).length;
    }
  }
  return {total, done, left:Math.max(0,total-done)};
}

  if(S.didSetup){ renderHub(); return; }
  app().innerHTML=`<header class="top"><div class="brand"><b>${t("setup")}</b><small>once</small></div></header>
    <div class="card"><p class="lede">${t("ui")}</p>
      <div class="row" style="flex-direction:row;gap:8px">
        <button class="btn" id="en">English</button><button class="btn" id="es">Español</button>
      </div></div>
    <div class="card"><p class="lede">${t("goal")}</p>
      <div class="row" style="flex-direction:row;gap:8px">
        <button class="btn" data-g="5">5</button><button class="btn" data-g="10">10</button><button class="btn" data-g="15">15</button>
      </div></div>
    <button class="btn primary" id="ok">Start</button>`;
  $("#en").onclick=()=>{S.ui="en";save();renderOnboard();};
  $("#es").onclick=()=>{S.ui="es";save();renderOnboard();};
  app().querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.goal=+b.dataset.g;save();renderOnboard();});
  $("#ok").onclick=()=>{S.didSetup=true;save();renderHub();};
}
function renderHub(){
  tickDay();
  const p=prog(S.xp||0);
  const cont=lastSit();
  const st=packStats();
  app().innerHTML=`<header class="top"><div class="brand"><b>${greet()}</b><small>Lv ${p.l} · ${S.streak||0} ${t("streak")}</small></div></header>
    <div class="hud">
      <div class="stat"><b>${S.xp||0}</b><span class="lede" style="margin:0">XP</span></div>
      <div class="stat"><b>${S.goal||10}</b><span class="lede" style="margin:0">min</span></div>
      <div class="stat"><b>${st.left}</b><span class="lede" style="margin:0">${t("left")}</span></div>
    </div>
    <div class="xpbar"><i style="width:${p.pct}%"></i></div>
    <p class="ph">${st.done} / ${st.total} lessons</p>
    <div class="card"><p class="lede">${t("daily")}</p>
      <button class="btn primary" id="cont">${t("cont")} · ${(()=>{const [a,b]=cont.split("."); const tm=(THEMES[a]||[]).find(x=>x.id===b); return tm?(S.ui==="es"?tm.es:tm.title):cont;})()}</button>
    </div>
    <p class="lede">Islands</p>
    <div class="isle" id="isles"></div>
    <nav class="nav"></nav>`;
  const box=$("#isles");
  WORLD.forEach(w=>{
    const b=document.createElement("button");
    b.style.setProperty("--tint", w.tint);
    b.disabled=!w.live;
    const n=packStatsTrack(w.id);
    b.innerHTML=`<b>${w.egg?"♥ ":""}${w.name}</b><span>${w.live?(n.total?n.done+" / "+n.total+" · "+w.blurb:w.blurb):"Locked"}</span>`;
    if(w.live) b.onclick=()=>renderTrack(w.id);
    box.appendChild(b);
  });
  $("#cont").onclick=()=>{ const [a,b]=cont.split("."); startSit(a,b,false); };
  nav("today");
}
function packStatsTrack(id){
  let total=0, done=0;
  const tr=trackOf(id);
  if(tr){
    for(const sec of tr.sections||[]){
      for(const u of sec.units||[]){
        const ls=lessonsFor(id,u.id);
        total+=ls.length;
        done+=ls.filter(L=>starsOf(id,L.id)>=1).length;
      }
    }
  }
  return {total, done};
}
function renderWorld(){ renderHub(); nav("map"); }
function renderTrack(id){
  const tr=trackOf(id);
  const w=WORLD.find(x=>x.id===id);
  if(!tr){ renderIslandLegacy(id); return; }
  app().innerHTML=`<header class="top"><div class="brand"><b>${w?w.name:tr.name}</b><small>${t("sec")}</small></div>
    <button class="btn ghost" id="back" style="width:auto;min-height:40px">${t("mapb")}</button></header>
    <p class="lede">${w?w.blurb:""}</p><div class="row" id="th"></div><nav class="nav"></nav>`;
  $("#back").onclick=renderHub;
  (tr.sections||[]).forEach(sec=>{
    const open=sectionOpen(id, sec.cefr);
    const units=liveUnits(id, sec.cefr);
    const all=(sec.units||[]).length;
    const b=document.createElement("button");
    b.className="btn";
    b.disabled=!open;
    b.innerHTML=`<b>${sec.cefr}</b><div class="ph">${open?(units.length+" live / "+all+" units"):t("soon")}</div>`;
    if(open) b.onclick=()=>renderSection(id, sec.cefr);
    $("#th").appendChild(b);
  });
  nav("map");
}
function renderSection(id, cefr){
  const tr=trackOf(id);
  const sec=(tr.sections||[]).find(s=>s.cefr===cefr);
  app().innerHTML=`<header class="top"><div class="brand"><b>${tr.name} · ${cefr}</b><small>units</small></div>
    <button class="btn ghost" id="back" style="width:auto;min-height:40px">${tr.name}</button></header>
    <div class="row" id="th"></div><nav class="nav"></nav>`;
  $("#back").onclick=()=>renderTrack(id);
  (sec.units||[]).forEach(u=>{
    const ls=lessonsFor(id,u.id);
    const open=ls.length && unitOpen(id, cefr, u.id);
    const st=ls.length?Math.min(...ls.map(L=>starsOf(id,L.id))):0;
    const b=document.createElement("button");
    b.className="btn";
    b.disabled=!open;
    b.innerHTML=`<b>${S.ui==="es"?u.es:u.title}</b><div class="ph">${ls.length?("★".repeat(Math.min(3,st))+" · "+ls.length+" lessons"):t("soon")}</div>`;
    if(open) b.onclick=()=>renderUnit(id, cefr, u.id);
    $("#th").appendChild(b);
  });
  nav("map");
}
function renderUnit(id, cefr, unitId){
  const tr=trackOf(id);
  const u=(tr.sections.find(s=>s.cefr===cefr).units||[]).find(x=>x.id===unitId);
  const ls=lessonsFor(id, unitId);
  app().innerHTML=`<header class="top"><div class="brand"><b>${S.ui==="es"?u.es:u.title}</b><small>${(u.guide||[]).join(" · ")}</small></div>
    <button class="btn ghost" id="back" style="width:auto;min-height:40px">${cefr}</button></header>
    <div class="row" id="th"></div><nav class="nav"></nav>`;
  $("#back").onclick=()=>renderSection(id, cefr);
  ls.forEach(tm=>{
    const st=starsOf(id, tm.id);
    const open=lessonOpen(id, cefr, unitId, tm.id);
    const b=document.createElement("button");
    b.className="btn";
    b.disabled=!open;
    b.innerHTML=`${tm.npc||""} <b>${S.ui==="es"?tm.es:tm.title}</b><div class="ph">${open?("★".repeat(st)+"☆".repeat(Math.max(0,3-st))+" · "+(tm.items||[]).length):t("soon")}</div>`;
    if(open) b.onclick=()=>startSit(id, tm.id, st>=3);
    $("#th").appendChild(b);
  });
  nav("map");
}
function renderIsland(id){ renderTrack(id); }
function renderIslandLegacy(id){
  const list=THEMES[id]||[];
  const w=WORLD.find(x=>x.id===id);
  app().innerHTML=`<header class="top"><div class="brand"><b>${w.name}</b><small>${list.length} lessons</small></div>
    <button class="btn ghost" id="back" style="width:auto;min-height:40px">${t("mapb")}</button></header>
    <p class="lede">${w.blurb}</p><div class="row" id="th"></div><nav class="nav"></nav>`;
  $("#back").onclick=renderHub;
  list.forEach(tm=>{
    const st=starsOf(id, tm.id);
    const b=document.createElement("button");
    b.className="btn";
    b.innerHTML=`${tm.npc||""} <b>${S.ui==="es"?tm.es:tm.title}</b><div class="ph">${"★".repeat(st)}${"☆".repeat(Math.max(0,3-st))} · ${tm.items.length}</div>`;
    b.onclick=()=>startSit(id,tm.id, st>=3);
    $("#th").appendChild(b);
  });
  nav("map");
}
function findLesson(track, lessonId){
  const tr=trackOf(track);
  if(tr){
    for(const sec of tr.sections||[]){
      for(const u of sec.units||[]){
        const hit=(lessonsFor(track,u.id)||[]).find(L=>L.id===lessonId);
        if(hit) return hit;
      }
    }
  }
  return themeLesson(track, lessonId);
}
function startSit(wid,tid,harder){
  const tm=findLesson(wid,tid); if(!tm) return;
  S.run={wid,tid,i:0,wrong:0,harder:!!harder}; save();
  renderSit();
}
function item(){ const R=S.run; const tm=findLesson(R.wid,R.tid); return tm&&tm.items[R.i]; }
function langOf(){
  const it=item();
  if(it&&it.lang) return it.lang;
  const R=S.run;
  if(R.wid==="fr") return "fr";
  if(R.wid==="flirt"){
    if(/pt|table-pt/.test(R.tid)) return "pt";
    if(/it|table-it/.test(R.tid)) return "it";
    if(/fr|table-fr/.test(R.tid)) return "fr";
  }
  return "de";
}
function speak(text, lang){
  if(!text||!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang==="fr"?"fr-FR":lang==="it"?"it-IT":lang==="pt"?"pt-PT":"de-DE";
  const vs=speechSynthesis.getVoices();
  const v=vs.find(x=>x.lang.toLowerCase().startsWith(u.lang.slice(0,2)));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function renderSit(){
  const R=S.run, tm=findLesson(R.wid,R.tid), it=item();
  if(!it) return sitDone();
  const L1=S.ui==="es"?it.es:it.en;
  const show=!R.harder && it.hear;
  const n=(tm.items||[]).length;
  app().innerHTML=`<div class="top"><button class="btn ghost" id="back" style="width:auto;min-height:40px">${t("island")}</button>
    <span class="ph">${R.i+1}/${n}</span></div>
    <div class="npc" id="npc">${tm.npc||"◎"}</div>
    ${show?`<div class="bub">${it.hear}</div><p class="lede">They said that. You answer.</p>`:`<div class="bub">${L1}</div>`}
    <p class="ph" id="ph">${R.harder?t("hard"):"("+it.ph+") · "+it.why}</p>
    <input class="ans" id="ans" autocapitalize="off" autocomplete="off">
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="check" style="flex:1">${t("check")}</button>
      <button class="btn ghost" id="mic" style="width:auto">mic</button>
      <button class="btn ghost" id="hear" style="width:auto">🔊</button>
    </div>
    <div id="feed"></div>
    <p class="ph">${it.why&&/Sie|du |Ihnen|Dein /.test(it.why)?t("du"):""}</p>
    <nav class="nav"></nav>`;
  $("#back").onclick=()=>renderIsland(R.wid);
  const lg=langOf();
  if(show) speak(it.hear, lg);
  $("#hear").onclick=()=>speak(R.harder||!it.hear?it.say:(it.hear||it.say), lg);
  $("#check").onclick=grade;
  $("#ans").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); grade(); } };
  $("#mic").onclick=()=>mic(lg);
  nav("map");
}
function norm(s){ return (s||"").trim().toLowerCase().replace(/[?!.,]/g,"").replace(/\s+/g," "); }
function grade(){
  const R=S.run, it=item();
  const ok=norm($("#ans").value)===norm(it.say);
  $("#npc").className="npc "+(ok?"yes":"no");
  if(!ok) R.wrong++;
  $("#ph").textContent="("+it.ph+") · "+it.why;
  $("#feed").innerHTML=`<div class="card"><b>${ok?t("yes"):t("no")}</b><div class="de">${it.say}</div><div class="ph">(${it.ph})</div></div>`;
  speak(it.say, langOf());
  $("#check").textContent=t("next");
  $("#check").onclick=()=>{
    if(ok){ R.i++; renderSit(); }
    else { $("#ans").value=""; $("#ans").focus(); $("#check").textContent=t("check"); $("#check").onclick=grade; }
  };
}
function mic(lang){
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){ $("#feed").innerHTML=`<div class="card">This Safari has no dictation. Type it.</div>`; return; }
  const r=new Rec(); r.lang=lang==="de"?"de-DE":lang==="fr"?"fr-FR":lang==="it"?"it-IT":"pt-PT";
  r.onresult=e=>{ $("#ans").value=e.results[0][0].transcript; grade(); };
  r.start();
}
function confetti(){
  const fx=document.createElement("div"); fx.id="fx"; document.body.appendChild(fx);
  for(let i=0;i<28;i++){
    const s=document.createElement("i");
    s.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-8px;width:6px;height:10px;background:hsl(${Math.random()*360},70%,60%);animation:bob .8s linear`;
    fx.appendChild(s);
  }
  setTimeout(()=>fx.remove(),900);
}
function sitDone(){
  const R=S.run;
  const stars=R.wrong===0?3:R.wrong===1?2:1;
  const k=R.wid+"."+R.tid;
  const prev=(S.sit[k]&&S.sit[k].stars)||0;
  S.sit[k]={stars:Math.max(prev,stars)};
  S.days=S.days||{}; S.days[today()]=true;
  awardXP(12*stars);
  if(R.wid==="flirt") S.eggs.flirt=true;
  save();
  if(stars===3) confetti();
  app().innerHTML=`<div class="card" style="text-align:center">
    <div class="npc">✦</div>
    <p class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</p>
    <p class="lede">${R.wrong} misses. 3★ replay is harder.</p>
    <button class="btn primary" id="back">${t("island")}</button>
  </div><nav class="nav"></nav>`;
  $("#back").onclick=()=>renderIsland(R.wid);
  nav("map");
}
function renderCal(){
  const days=[...Array(7)].map((_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-6+i);
    const k=d.toISOString().slice(0,10);
    return {k, lab:"SMTWTFS"[d.getDay()], on:!!(S.days&&S.days[k])};
  });
  app().innerHTML=`<header class="top"><div class="brand"><b>${t("cal")}</b><small>${S.streak||0} ${t("streak")}</small></div></header>
    <div class="week">${days.map(d=>`<div class="dot ${d.on?"on":""}">${d.lab}</div>`).join("")}</div>
    <div class="card"><p class="lede">A mark is a finished lesson that day. No fake heat.</p></div>
    <nav class="nav"></nav>`;
  nav("cal");
}
function renderYou(){
  const p=prog(S.xp||0);
  const skins=SKINS.filter(s=>!s.egg||S.eggs.flirt||S.xp>=(s.min||0));
  const mas=MASCOTS.filter(m=>!m.egg||S.eggs.flirt);
  app().innerHTML=`<header class="top"><div class="brand"><b>${S.name||"You"}</b><small>Lv ${p.l}</small></div></header>
    <div class="card">
      <p class="lede">${t("ui")}</p>
      <div class="row" style="flex-direction:row;gap:8px">
        <button class="btn ${S.ui==="en"?"primary":""}" id="en">EN</button>
        <button class="btn ${S.ui==="es"?"primary":""}" id="es">ES</button>
      </div>
    </div>
    <div class="card"><p class="lede">${t("skins")}</p><div class="skins" id="sk"></div></div>
    <div class="card"><p class="lede">${t("mascots")}</p><div class="row" id="ms"></div></div>
    <div class="card"><p class="lede">${t("backup")}</p>
      <button class="btn" id="exp">${t("exp")}</button>
      <button class="btn" id="imp">${t("imp")}</button>
    </div>
    <p class="ph">♥ Ragazzas is an island. After-hours skin unlocks when you finish one scene there.</p>
    <nav class="nav"></nav>`;
  $("#en").onclick=()=>{S.ui="en";save();renderYou();};
  $("#es").onclick=()=>{S.ui="es";save();renderYou();};
  skins.forEach(s=>{
    const b=document.createElement("button");
    b.className="btn"+(S.theme===s.id?" primary":"");
    b.textContent=s.name+(S.xp<(s.min||0) && !s.egg?" · Lv":"");
    b.disabled=S.xp<(s.min||0) && !s.egg;
    b.onclick=()=>{S.theme=s.id; document.documentElement.dataset.theme=s.id; save(); renderYou();};
    $("#sk").appendChild(b);
  });
  mas.forEach(m=>{
    const ok=S.xp>=(m.min||0);
    const b=document.createElement("button");
    b.className="btn"; b.disabled=!ok;
    b.textContent=`${m.e} ${m.name}${ok?"":" · "+m.min+" XP"}`;
    b.onclick=()=>{ if(ok){ S.mascot=m.id; save(); } };
    $("#ms").appendChild(b);
  });
  $("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="sprechen-backup.json"; a.click();
  };
  $("#imp").onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
    inp.onchange=async()=>{ const txt=await inp.files[0].text(); Object.assign(S, JSON.parse(txt)); save(); renderYou(); };
    inp.click();
  };
  nav("you");
}
function boot(){
  load();
  if(!S.hash) renderLogin();
  else if(!S.didSetup) renderOnboard();
  else renderHub();
}
document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
</html>
