<style>
:root{
  --bg:#0E1116; --elev:#161B22; --card:#1A2029; --ink:#E8EAED; --muted:#8B919C;
  --line:#2A303A; --accent:#E8B86D; --on:#0E1116; --ok:#3D9B6E; --bad:#C45C4A;
  --radius:16px; --touch:48px;
}
html[data-theme="berlin"]{ --bg:#0B1220; --elev:#132038; --card:#17263F; --accent:#7EB6FF; --on:#0B1220; }
html[data-theme="stone"]{ --bg:#121212; --elev:#1C1C1C; --card:#222; --accent:#C4B8A5; --ink:#EEE; --muted:#9A958C; --line:#333; --on:#121212; }
html[data-theme="afterhours"]{ --bg:#140C12; --elev:#1E121A; --card:#261820; --accent:#E07A9A; --on:#140C12; }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  font-size:16px;line-height:1.45}
body{background:radial-gradient(900px 420px at 50% -20%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 55%), var(--bg)}
button,input{font:inherit;color:inherit} button{cursor:pointer}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px 112px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.brand b{display:block;font-size:1.28rem;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:1.05rem}
.lede{color:var(--muted);margin:0 0 10px}
.isle{display:grid;gap:10px}
.isle button{
  text-align:left;border:1px solid var(--line);border-radius:18px;min-height:72px;
  padding:14px 16px;background:var(--card);color:var(--ink);
  background-image:linear-gradient(135deg, color-mix(in srgb, var(--tint, var(--accent)) 22%, transparent), transparent 60%);
}
.isle button b{display:block;font-size:1.05rem}
.isle button span{color:var(--muted);font-size:.86rem}
.isle button[disabled]{opacity:.38}
.btn{border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:var(--touch);
  font-weight:650;background:var(--elev);text-align:left;width:100%}
.btn.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.ghost{background:transparent}
.row{display:flex;flex-direction:column;gap:8px}
.ans{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--elev)}
.ph{color:var(--muted);font-size:.9rem;margin:6px 0}
.de{font-weight:700;font-size:1.2rem}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:color-mix(in srgb, var(--bg) 92%, black);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{border:0;background:transparent;color:var(--muted);min-height:48px;border-radius:12px;font-size:.68rem;font-weight:700}
.nav button.on{color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted)}
.dot.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.npc{font-size:3.2rem;text-align:center;line-height:1;margin:8px 0;animation:bob 2.4s ease-in-out infinite}
.npc.yes{animation:pop .4s ease}
.npc.no{animation:shake .35s ease}
.bub{background:var(--ink);color:var(--bg);border-radius:16px 16px 16px 4px;padding:12px 14px;font-weight:700}
.stars{color:var(--accent);letter-spacing:.12em}
.xpbar{height:8px;background:var(--elev);border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--accent);width:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:24px}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

function trackOf(id){ return (typeof COURSE!=="undefined" && COURSE.tracks||[]).find(x=>x.id===id); }
function themeLesson(track, themeId){
  return (typeof THEMES!=="undefined" && THEMES[track]||[]).find(x=>x.id===themeId);
}
function lessonsFor(trackId, unitId){
  const out=[];
  const tr=trackOf(trackId); if(!tr) return out;
  for(const sec of tr.sections||[]){
    const u=(sec.units||[]).find(x=>x.id===unitId);
    if(u){ for(const L of u.lessons||[]) out.push(L); }
  }
  const bid=(BRIDGE[trackId]||{})[unitId];
  const tm=bid && themeLesson(trackId, bid);
  if(tm && !out.some(x=>x.id===tm.id)) out.push(tm);
  if(trackId==="flirt" && unitId==="table-de"){
    const looks=themeLesson("flirt","looks");
    if(looks && !out.some(x=>x.id==="looks")) out.push(looks);
  }
  if(trackId==="de" && unitId==="bar"){
    const v=themeLesson("de","view");
    if(v && !out.some(x=>x.id==="view")) out.push(v);
  }
  return out;
}
function starsOf(track, lessonId){ return (S.sit&&S.sit[track+"."+lessonId]&&S.sit[track+"."+lessonId].stars)||0; }
function unitDone(trackId, unitId){
  const ls=lessonsFor(trackId, unitId);
  if(!ls.length) return false;
  return ls.every(L=>starsOf(trackId, L.id)>=1);
}
function liveUnits(trackId, cefr){
  const tr=trackOf(trackId); if(!tr) return [];
  const sec=(tr.sections||[]).find(s=>s.cefr===cefr);
  return (sec&&sec.units||[]).filter(u=>lessonsFor(trackId,u.id).length);
}
function sectionOpen(trackId, cefr){
  const tr=trackOf(trackId); if(!tr||!tr.live) return false;
  const secs=tr.sections||[];
  const i=secs.findIndex(s=>s.cefr===cefr);
  if(i<=0) return true;
  const prev=secs[i-1];
  const units=liveUnits(trackId, prev.cefr);
  if(!units.length) return false;
  const ok=units.filter(u=>unitDone(trackId,u.id)).length;
  return ok/units.length>=0.8;
}
function unitOpen(trackId, cefr, unitId){
  if(!sectionOpen(trackId, cefr)) return false;
  const units=liveUnits(trackId, cefr);
  const i=units.findIndex(u=>u.id===unitId);
  if(i<=0) return true;
  return unitDone(trackId, units[i-1].id);
}
function lessonOpen(trackId, cefr, unitId, lessonId){
  if(!unitOpen(trackId, cefr, unitId)) return false;
  const ls=lessonsFor(trackId, unitId);
  const i=ls.findIndex(L=>L.id===lessonId);
  if(i<=0) return true;
  return starsOf(trackId, ls[i-1].id)>=1;
}
function packStats(){
  let total=0, done=0;
  for(const tr of (typeof COURSE!=="undefined" && COURSE.tracks)||[]){
    for(const sec of tr.sections||[]){
      for(const u of sec.units||[]){
        const ls=lessonsFor(tr.id, u.id);
        total+=ls.length;
        done+=ls.filter(L=>starsOf(tr.id,L.id)>=1).length;
      }
    }
  }
  if(!total && typeof THEMES!=="undefined"){
    for(const k of Object.keys(THEMES)){
      const arr=THEMES[k]||[];
      total+=arr.length;
      done+=arr.filter(tm=>starsOf(k,tm.id)>=1).length;
    }
  }
  return {total, done, left:Math.max(0,total-done)};
}
function xpForLevel(n){ if(n<=1) return 0; return Math.round(50*Math.pow(n,1.6)); }
function levelOf(xp){ let l=1; while(xpForLevel(l+1)<=xp && l<99) l++; return l; }
function prog(xp){ const l=levelOf(xp), a=xpForLevel(l), b=xpForLevel(l+1); return {l, pct: Math.round(100*(xp-a)/Math.max(1,b-a))}; }

  const u=(tr.sections.find(s=>s.cefr===cefr).units||[]).find(x=>x.id===unitId);
  const ls=lessonsFor(id, unitId);
  app().innerHTML=`<header class="top"><div class="brand"><b>${S.ui==="es"?u.es:u.title}</b><small>${(u.guide||[]).join(" · ")}</small></div>
    <button class="btn ghost" id="back" style="width:auto;min-height:40px">${cefr}</button></header>
    <div class="row" id="th"></div><nav class="nav"></nav>`;
  $("#back").onclick=()=>renderSection(id, cefr);
  ls.forEach(tm=>{
    const st=starsOf(id, tm.id);
    const open=lessonOpen(id, cefr, unitId, tm.id);
    const b=document.createElement("button");
    b.className="btn";
    b.disabled=!open;
    b.innerHTML=`${tm.npc||""} <b>${S.ui==="es"?tm.es:tm.title}</b><div class="ph">${open?("★".repeat(st)+"☆".repeat(Math.max(0,3-st))+" · "+(tm.items||[]).length):t("soon")}</div>`;
    if(open) b.onclick=()=>startSit(id, tm.id, st>=3);
    $("#th").appendChild(b);
  });
  nav("map");
}
function renderIsland(id){ renderTrack(id); }
function renderIslandLegacy(id){
  const list=THEMES[id]||[];
  const w=WORLD.find(x=>x.id===id);
  app().innerHTML=`<header class="top"><div class="brand"><b>${w.name}</b><small>${list.length} lessons</small></div>
    <button class="btn ghost" id="back" style="width:auto;min-height:40px">${t("mapb")}</button></header>
    <p class="lede">${w.blurb}</p><div class="row" id="th"></div><nav class="nav"></nav>`;
  $("#back").onclick=renderHub;
  list.forEach(tm=>{
    const st=starsOf(id, tm.id);
    const b=document.createElement("button");
    b.className="btn";
    b.innerHTML=`${tm.npc||""} <b>${S.ui==="es"?tm.es:tm.title}</b><div class="ph">${"★".repeat(st)}${"☆".repeat(Math.max(0,3-st))} · ${tm.items.length}</div>`;
    b.onclick=()=>startSit(id,tm.id, st>=3);
    $("#th").appendChild(b);
  });
  nav("map");
}
function startSit(wid,tid,harder){
  const tm=(THEMES[wid]||[]).find(x=>x.id===tid); if(!tm) return;
  S.run={wid,tid,i:0,wrong:0,harder:!!harder}; save();
  renderSit();
}
function item(){ const R=S.run; return THEMES[R.wid].find(x=>x.id===R.tid).items[R.i]; }
function langOf(){
  const R=S.run;
  if(R.wid==="fr"||(R.wid==="flirt"&&R.tid==="fr")) return "fr";
  if(R.wid==="flirt"&&R.tid==="it") return "it";
  if(R.wid==="flirt"&&(R.tid==="pt"||R.tid==="dawn"&&R.i===0)) return "pt";
  if(R.wid==="flirt"&&R.tid==="dawn"&&R.i===1) return "it";
  if(R.wid==="flirt"&&R.tid==="dawn"&&R.i===2) return "fr";
  return "de";
}
function speak(text, lang){
  if(!text||!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang==="fr"?"fr-FR":lang==="it"?"it-IT":lang==="pt"?"pt-PT":"de-DE";
  const vs=speechSynthesis.getVoices();
  const v=vs.find(x=>x.lang.toLowerCase().startsWith(u.lang.slice(0,2)));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function renderSit(){
  const R=S.run, it=item();
  if(!it) return sitDone();
  const L1=S.ui==="es"?it.es:it.en;
  const show=!R.harder && it.hear;
  const n=THEMES[R.wid].find(x=>x.id===R.tid).items.length;
  app().innerHTML=`<div class="top"><button class="btn ghost" id="back" style="width:auto;min-height:40px">${t("island")}</button>
    <span class="ph">${R.i+1}/${n}</span></div>
    <div class="npc" id="npc">${(THEMES[R.wid].find(x=>x.id===R.tid).npc)||"◎"}</div>
    ${show?`<div class="bub">${it.hear}</div><p class="lede">They said that. You answer.</p>`:`<div class="bub">${L1}</div>`}
    <p class="ph" id="ph">${R.harder?t("hard"):"("+it.ph+") · "+it.why}</p>
    <input class="ans" id="ans" autocapitalize="off" autocomplete="off">
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="check" style="flex:1">${t("check")}</button>
      <button class="btn ghost" id="mic" style="width:auto">mic</button>
      <button class="btn ghost" id="hear" style="width:auto">🔊</button>
    </div>
    <div id="feed"></div>
    <p class="ph">${it.why&&/Sie|du |Ihnen|Dein /.test(it.why)?t("du"):""}</p>
    <nav class="nav"></nav>`;
  $("#back").onclick=()=>renderIsland(R.wid);
  const lg=langOf();
  if(show) speak(it.hear, lg);
  $("#hear").onclick=()=>speak(R.harder||!it.hear?it.say:(it.hear||it.say), lg);
  $("#check").onclick=grade;
  $("#ans").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); grade(); } };
  $("#mic").onclick=()=>mic(lg);
  nav("map");
}
function norm(s){ return (s||"").trim().toLowerCase().replace(/[?!.,]/g,"").replace(/\s+/g," "); }
function grade(){
  const R=S.run, it=item();
  const ok=norm($("#ans").value)===norm(it.say);
  $("#npc").className="npc "+(ok?"yes":"no");
  if(!ok) R.wrong++;
  $("#ph").textContent="("+it.ph+") · "+it.why;
  $("#feed").innerHTML=`<div class="card"><b>${ok?t("yes"):t("no")}</b><div class="de">${it.say}</div><div class="ph">(${it.ph})</div></div>`;
  speak(it.say, langOf());
  $("#check").textContent=t("next");
  $("#check").onclick=()=>{
    if(ok){ R.i++; renderSit(); }
    else { $("#ans").value=""; $("#ans").focus(); $("#check").textContent=t("check"); $("#check").onclick=grade; }
  };
}
function mic(lang){
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){ $("#feed").innerHTML=`<div class="card">This Safari has no dictation. Type it.</div>`; return; }
  const r=new Rec(); r.lang=lang==="de"?"de-DE":lang==="fr"?"fr-FR":lang==="it"?"it-IT":"pt-PT";
  r.onresult=e=>{ $("#ans").value=e.results[0][0].transcript; grade(); };
  r.start();
}
function confetti(){
  const fx=document.createElement("div"); fx.id="fx"; document.body.appendChild(fx);
  for(let i=0;i<28;i++){
    const s=document.createElement("i");
    s.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-8px;width:6px;height:10px;background:hsl(${Math.random()*360},70%,60%);animation:bob .8s linear`;
    fx.appendChild(s);
  }
  setTimeout(()=>fx.remove(),900);
}
function sitDone(){
  const R=S.run;
  const stars=R.wrong===0?3:R.wrong===1?2:1;
  const k=R.wid+"."+R.tid;
  const prev=(S.sit[k]&&S.sit[k].stars)||0;
  S.sit[k]={stars:Math.max(prev,stars)};
  S.days=S.days||{}; S.days[today()]=true;
  awardXP(12*stars);
  if(R.wid==="flirt") S.eggs.flirt=true;
  save();
  if(stars===3) confetti();
  app().innerHTML=`<div class="card" style="text-align:center">
    <div class="npc">✦</div>
    <p class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</p>
    <p class="lede">${R.wrong} misses. 3★ replay is harder.</p>
    <button class="btn primary" id="back">${t("island")}</button>
  </div><nav class="nav"></nav>`;
  $("#back").onclick=()=>renderIsland(R.wid);
  nav("map");
}
function renderCal(){
  const days=[...Array(7)].map((_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-6+i);
    const k=d.toISOString().slice(0,10);
    return {k, lab:"SMTWTFS"[d.getDay()], on:!!(S.days&&S.days[k])};
  });
  app().innerHTML=`<header class="top"><div class="brand"><b>${t("cal")}</b><small>${S.streak||0} ${t("streak")}</small></div></header>
    <div class="week">${days.map(d=>`<div class="dot ${d.on?"on":""}">${d.lab}</div>`).join("")}</div>
    <div class="card"><p class="lede">A mark is a finished lesson that day. No fake heat.</p></div>
    <nav class="nav"></nav>`;
  nav("cal");
}
function renderYou(){
  const p=prog(S.xp||0);
  const skins=SKINS.filter(s=>!s.egg||S.eggs.flirt||S.xp>=(s.min||0));
  const mas=MASCOTS.filter(m=>!m.egg||S.eggs.flirt);
  app().innerHTML=`<header class="top"><div class="brand"><b>${S.name||"You"}</b><small>Lv ${p.l}</small></div></header>
    <div class="card">
      <p class="lede">${t("ui")}</p>
      <div class="row" style="flex-direction:row;gap:8px">
        <button class="btn ${S.ui==="en"?"primary":""}" id="en">EN</button>
        <button class="btn ${S.ui==="es"?"primary":""}" id="es">ES</button>
      </div>
    </div>
    <div class="card"><p class="lede">${t("skins")}</p><div class="skins" id="sk"></div></div>
    <div class="card"><p class="lede">${t("mascots")}</p><div class="row" id="ms"></div></div>
    <div class="card"><p class="lede">${t("backup")}</p>
      <button class="btn" id="exp">${t("exp")}</button>
      <button class="btn" id="imp">${t("imp")}</button>
    </div>
    <p class="ph">♥ Ragazzas is an island. After-hours skin unlocks when you finish one scene there.</p>
    <nav class="nav"></nav>`;
  $("#en").onclick=()=>{S.ui="en";save();renderYou();};
  $("#es").onclick=()=>{S.ui="es";save();renderYou();};
  skins.forEach(s=>{
    const b=document.createElement("button");
    b.className="btn"+(S.theme===s.id?" primary":"");
    b.textContent=s.name+(S.xp<(s.min||0) && !s.egg?" · Lv":"");
    b.disabled=S.xp<(s.min||0) && !s.egg;
    b.onclick=()=>{S.theme=s.id; document.documentElement.dataset.theme=s.id; save(); renderYou();};
    $("#sk").appendChild(b);
  });
  mas.forEach(m=>{
    const ok=S.xp>=(m.min||0);
    const b=document.createElement("button");
    b.className="btn"; b.disabled=!ok;
    b.textContent=`${m.e} ${m.name}${ok?"":" · "+m.min+" XP"}`;
    b.onclick=()=>{ if(ok){ S.mascot=m.id; save(); } };
    $("#ms").appendChild(b);
  });
  $("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="sprechen-backup.json"; a.click();
  };
  $("#imp").onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
    inp.onchange=async()=>{ const txt=await inp.files[0].text(); Object.assign(S, JSON.parse(txt)); save(); renderYou(); };
    inp.click();
  };
  nav("you");
}
function boot(){
  load();
  if(!S.hash) renderLogin();
  else if(!S.didSetup) renderOnboard();
  else renderHub();
}
document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
</html>
