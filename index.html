<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sprechen</title>
<style>
:root{
  --bg:#efe7d6; --ink:#111; --muted:#3a3a3a; --card:#fffdf8;
  --line:#111; --red:#b11226; --cream:#fffdf8; --hp:#0b6b2b;
  --gold:#8a6a00; --ok:#0b6b2b; --bad:#b11226; --sky:#efe7d6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; font-size:17px; line-height:1.4}
body{background:var(--bg)}
button,input{font:inherit;color:inherit} button{cursor:pointer}
.wrap{max-width:430px;margin:0 auto;padding:12px 14px 120px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.mark{display:flex;gap:10px;align-items:center}
.ball{width:36px;height:36px;border-radius:50%;background:linear-gradient(#e3350d 0 50%, #fff 50%);
  border:3px solid var(--ink); position:relative; flex:0 0 auto}
.ball::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;
  background:#fff;border:3px solid var(--ink);border-radius:50%}
.brand b{display:block;font-size:1.35rem;font-weight:800;letter-spacing:-.03em}
.brand small{color:var(--muted);font-size:.92rem}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:160px}
.langs button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 9px;font-size:.75rem;font-weight:800;min-height:32px}
.langs button.on{background:var(--ink);color:#fff}
.langs button.off{display:none}
.card,.stat,.unit,.step,.choice,.chip,.speak,.search,.face,.explain{
  background:#fff; border:3px solid var(--ink); border-radius:18px;
}
.card{padding:14px 14px 16px; margin:10px 0; box-shadow: 0 5px 0 #111}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:10px 12px}
.stat b{display:block;font-size:1.05rem;font-weight:800}
h2,h3{margin:0 0 8px;font-size:1.05rem;font-weight:800}
.lede{color:var(--muted);margin:0 0 10px}
.rowbtns{display:flex;flex-direction:column;gap:8px}
.btn{border:3px solid var(--ink); border-radius:16px; padding:11px 14px; min-height:46px; font-weight:800; background:#fff; text-align:left}
.btn.primary{background:var(--red); color:#fff}
.btn.accent{background:#111; color:#fff}
.btn.ghost{background:#fffdf8}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn:active{transform:translateY(2px)}
.xpbar,.progress,.bar i{height:12px;background:#fff;border:2px solid var(--ink);border-radius:99px;overflow:hidden;padding:0}
.xpbar>i,.progress>i,.bar i b{display:block;height:100%;width:0;background:var(--hp);border-radius:99px}
.progress{margin:8px 0 12px;border:2px solid var(--ink);height:14px}
.bars{display:grid;gap:6px;margin:10px 0}
.bar{display:grid;grid-template-columns:52px 1fr 40px;gap:6px;align-items:center;font-size:.85rem;font-weight:800}
.lvl{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:800;border:2px solid var(--ink);background:var(--cream)}
.A11,.A12,.A2,.A2p{background:#fff;color:#111}
.world,.overworld{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.node,.unit{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;text-align:left;width:100%;margin:0}
.n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--cream);border:2px solid var(--ink)}
.de{font-weight:800;font-size:1.35rem;line-height:1.3;color:var(--ink)}
.eshint{color:var(--muted);font-size:.92rem;margin-top:6px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;font-weight:700;margin-bottom:6px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.choice,.chip{padding:12px;text-align:left;min-height:48px;font-weight:800}
.choice.on{background:var(--cream); box-shadow:inset 0 0 0 3px var(--red)}
.choice.good{background:#c8efd0}
.choice.nope{background:#f5c4c0}
.build{min-height:58px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;background:var(--cream);border:3px dashed var(--ink);border-radius:16px;margin-top:8px}
.speak{width:46px;height:46px;border-radius:50%}
.explain{margin-top:10px;padding:12px;line-height:1.45}
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:5;
  background:#fff; border-top:3px solid var(--ink);
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));
}
.nav button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:.9rem;padding:10px 4px;border-radius:14px}
.nav button.on{color:#fff; background:#111}
.flip{min-height:180px;margin:8px 0 12px}
.flip .inner{position:relative;min-height:180px}
.face{min-height:180px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.flip .face.back{display:none}
.flip.on .face{display:none}
.flip.on .face.back{display:flex; transform:none; background:var(--ink); color:#fff}
.back .de{color:#fff}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:12px;text-align:left}
.step .n{background:var(--ink);color:#fff}
.search{width:100%;padding:12px;margin-bottom:8px}
.item{padding:12px 0;border-bottom:2px solid #111}
.tenses{display:grid;gap:4px;margin-top:8px}
.tenses b{color:var(--red);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.tenses>div{display:flex;align-items:flex-start;gap:8px;margin:6px 0}
.tenses>div b{flex:0 0 42px}
.tenses .speak{width:36px;height:36px;flex:0 0 36px;margin-left:auto}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.badge{width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.badge.on{background:var(--gold)}
.skyline,.hero-bob,.pix{display:none}
.lv{font-weight:800}
.ans{width:100%;padding:14px;border:3px solid var(--ink);border-radius:16px;
  font-size:1.15rem;font-weight:700;background:#fff;margin-top:10px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

</style>
</head>

e pregunto mañana."]},{"u":2,"inf":"denken","es":"pensar","aux":"haben","part":"gedacht","pk":"perf","ich":"denke","du":"denkst","er":"denkt","wir":"denken","pret":"","sep":"","refl":false,"now":["Ich denke oft an dich.","Pienso mucho en ti."],"past":["Ich habe an uns gedacht.","Pensé en nosotros."],"fut":["Denk an mich.","Piensa en mí."]},{"u":2,"inf":"glauben","es":"creer","aux":"haben","part":"geglaubt","pk":"perf","ich":"glaube","du":"glaubst","er":"glaubt","wir":"glauben","pret":"","sep":"","refl":false,"now":["Ich glaube dir.","Te creo."],"past":["Ich habe das nicht geglaubt.","No me lo creí."],"fut":["Du wirst es noch glauben.","Ya te lo vas a creer."]},{"u":2,"inf":"meinen","es":"opinar / querer decir","aux":"haben","part":"gemeint","pk":"perf","ich":"meine","du":"meinst","er":"meint","wir":"meinen","pret":"","sep":"","refl":false,"now":["Was meinst du?","¿Tú qué opinas?"],"past":["Ich habe das nicht so gemeint.","No lo dije así."],"fut":["Sag mir, was du wirklich meinst.","Dime lo que de verdad opinas."]},{"u":2,"inf":"kennen","es":"conocer (persona/sitio)","aux":"haben","part":"gekannt","pk":"perf","ich":"kenne","du":"kennst","er":"kennt","wir":"kennen","pret":"","sep":"","refl":false,"now":["Ich kenne ihn gut.","Lo conozco bien."],"past":["Ich habe sie früher gekannt.","La conocí antes."],"fut":["Dann wirst du die Stadt kennen.","Entonces vas a conocer la ciudad."]},{"u":2,"inf":"heißen","es":"llamarse","aux":"haben","part":"geheißen","pk":"perf","ich":"heiße","du":"heißt","er":"heißt","wir":"heißen","pret":"","sep":"","refl":false,"now":["Ich heiße Oliver.","Me llamo Oliver."],"past":["Wie hat das geheißen?","¿Cómo se llamaba eso?"],"fut":["Wie wird das Kind heißen?","¿Cómo se va a llamar el niño?"]},{"u":2,"inf":"bleiben","es":"quedarse","aux":"sein","part":"geblieben","pk":"perf","ich":"bleibe","du":"bleibst","er":"bleibt","wir":"bleiben","pret":"","sep":"","refl":false,"now":["Ich bleibe hier.","Me quedo aquí."],"past":["Ich bin zu Hause geblieben."," function hydrate(){
  const fix={aufstehen:["Ich stehe um sieben auf.","Me levanto a las siete."]};
  return V0.map(v=>{
    const e=EN[v.inf]; if(!e) throw new Error("missing EN "+v.inf);
    const nowDe=fix[v.inf]?fix[v.inf][0]:v.now[0];
    const nowEs=fix[v.inf]?fix[v.inf][1]:v.now[1];
    return Object.assign({},v,{
      en:e[0], lvl:LVL(v.u),
      now:[nowDe,e[1],nowEs],
      past:[v.past[0],e[2],v.past[1]],
      fut:[v.inf==="aufstehen"?"Morgen stehe ich früher auf.":v.fut[0], e[3],
           v.inf==="aufstehen"?"Mañana me levanto antes.":v.fut[1]]
    });
  });
}

let speakGen=0;
function deVoice(){
  try{return speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith("de"))||null;}catch(e){return null;}
}
function speak(text){
  if(!text) return;
  const gen=++speakGen;
  const run=()=>{
    if(gen!==speakGen) return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang="de-DE"; u.rate=.92;
      const de=deVoice(); if(de) u.voice=de;
      if(gen!==speakGen) return;
      speechSynthesis.speak(u);
    }catch(e){}
  };
  try{
    if(!speechSynthesis.getVoices().length){
      speechSynthesis.onvoiceschanged=run;
      setTimeout(run,250);
    } else {
      setTimeout(run,40);
    }
  }catch(e){}
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function tokens(s){return s.replace(/[¿?¡!.,]/g," ").split(/\s+/).filter(Boolean);}
function norm(s){return s.toLowerCase().replace(/ß/g,"ss").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim();}

function unitMastery(i){
  const vs=V.filter(v=>v.u===i); if(!vs.length) return 0;
  return vs.reduce((a,v)=>a+mastery(v),0)/(vs.length*4);
}
function recommendedUnit(){
  for(let i=S.floor||0;i<10;i++) if(unitMastery(i)<0.7) return i;
  return 9;

function unlocked(i){
  if(i<=(S.floor||0)) return true;
  return unitMastery(i-1)>=0.35;
}
function tickStreak(){
  const d=new Date().toISOString().slice(0,10);
  if(S.lastDay===d) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  S.streak = S.lastDay===y.toISOString().slice(0,10) ? (S.streak||0)+1 : 1;
  S.lastDay=d; save();
}
function beep(ok){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="square"; o.frequency.value=ok?520:180; g.gain.value=0.04;
    o.connect(g); g.connect(ctx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.12);
    o.stop(ctx.currentTime+0.13);
  }catch(e){}
}

  const now=Date.now();

  if(!S.srs[id]) S.srs[id]={due:Date.now(), ivl:0, ef:2.5, n:0, ...payload};

function makeCardsFromVerbs(){
  V.forEach(v=>{
    if(!mastery(v)) return;
    ["now","past","fut"].forEach(tense=>{
      const id=v.inf+"|"+tense;
      ensureSrs(id,{kind:"verb",inf:v.inf,tense});
    });
  });
  STEPS.forEach(s=>ensureSrs("step|"+s.id,{kind:"step",sid:s.id}));
  save();
}
function reviewSrs(id, grade){
  // grade: 0 again, 1 hard, 2 good, 3 easy
  const c=S.srs[id]||{ivl:0,ef:2.5,n:0};
  if(grade===0){c.ivl=0; c.due=Date.now()+2*60*1000; c.n=0;}
  else{
    c.n++;
    if(c.ivl===0) c.ivl = grade===1?0.5: grade===2?1:3;
    else c.ivl = c.ivl * (grade===1?1.2: grade===2?2.3:3.3);
    c.due=Date.now()+c.ivl*24*60*60*1000;
  }
  S.srs[id]=c; save();
}

  }

    </div></div>
    <div class="rowbtns" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn ghost" id="flipb">${t("flip")}</button>
      <button class="btn ghost" id="hear">${t("hear")}</button>
      <button class="btn bad" id="g0">${t("again")}</button>
      <button class="btn ghost" id="g1">${t("hard")}</button>
      <button class="btn ok" id="g2">${t("good")}</button>
      <button class="btn accent" id="g3">${t("easy")}</button>
    </div>`;
  const flip=()=>$("#fc").classList.toggle("on");
  $("#flipb").onclick=flip; $("#fc").onclick=flip;
  $("#hear").onclick=()=>speak(deLine);
  [0,1,2,3].forEach(g=>$("#g"+g).onclick=()=>{reviewSrs(id,g); if(g>=2) S.xp+=5; save(); renderCards();});
  nav();
}

function startSession(weak=false, unit=null){
  tickStreak();
  if(unit==null && !weak) unit = recommendedUnit();
  S.lastUnit = unit==null? S.lastUnit: unit; save();
  let pool= unit!=null? V.filter(v=>v.u===unit) : weak? V.filter(v=>mastery(v)<4).sort((a,b)=>mastery(a)-mastery(b)) : V;
  if(S.filter && S.filter!=="all") pool=pool.filter(v=>v.lvl===S.filter);
  if(!pool.length) pool=V;
  const pick=shuffle(pool).slice(0,8);
  S.queue=pick.flatMap(v=>["now","past","fut"].map(tense=>({kind:"say",v,tense})));
  S.idx=0; S.total=S.queue.length; S.locked=false; S.q=S.queue[0]; S.screen="speak";
  renderQ();
}
function pickTense(v){const s=S.seen[v.inf]||{}; if(!s.now)return"now"; if(!s.past)return"past"; if(!s.fut)return"fut";
  return ["now","past","fut"][Math.floor(Math.random()*3)];}
function mark(inf,key){S.seen[inf]=S.seen[inf]||{}; S.seen[inf][key]=true; save();}

function renderQ(){
  if(!S.q){renderDone(); return;}
  const q=S.q,v=q.v, pct=Math.round(100*S.idx/Math.max(1,S.total));
  const prompt=line(v,q.tense,pivot());
  const body=`<p class="lede">${t("sayHint")}</p>
    <p class="de">${esc(prompt)}</p>
    <input class="ans" id="ans" type="text" enterkeyhint="done" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="…">`;
  app.innerHTML=`<div class="qmeta"><button class="btn ghost" id="toMap" style="min-height:36px;padding:6px 10px">${t("mapBack")}</button><span>${S.idx+1}/${S.total}</span><span class="lvl ${LCLS(v.lvl)}">${v.lvl}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="card">${body}<div id="feed"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn primary" id="check" style="flex:1">${t("check")}</button>
      </div></div>`;
  const inp=$("#ans");
  if(inp){ inp.focus(); inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); grade(); } }; }
  $("#check").onclick=grade; const tm=$("#toMap"); if(tm) tm.onclick=()=>{S.q=null;S.queue=[]; go("home");};
  nav();
}
function grade(){
  if(S.locked){ next(); return; }
  const q=S.q,v=q.v;
  const de=v[q.tense][0];
  const typed=($("#ans")&&$("#ans").value)||"";
  const ok=norm(typed)===norm(de);
  let why=q.tense==="past"?(v.pk==="pret"?`Spoken: ich ${v.pret}.`:`${v.aux} + ${v.part}.`)
    :q.tense==="fut"?`Present + time, or werden.`
    :`ich ${v.ich} · du ${v.du} · er ${v.er}`;
  if(ok) mark(v.inf,q.tense);
  if(ok) mark(v.inf,"mean");
  S.locked=true;
  if($("#ans")) $("#ans").disabled=true;
  $("#feed").innerHTML=`<div class="explain"><b>${ok?t("ok"):t("almost")}</b>
    <div class="de" style="font-size:1.18rem;margin-top:6px">${de}</div>
    <div style="margin-top:6px">${v.inf} · ${why}</div></div>`;
  if(ok){S.xp+=10; save(); beep(true);} else {S.queue.push(q); beep(false);}
  $("#check").textContent=ok?t("next"):t("againQ");
  $("#check").classList.add(ok?"ok":"bad");
  const hear=document.createElement("button");
  hear.className="btn ghost"; hear.id="hearNow"; hear.textContent=t("hear");
  hear.onclick=()=>speak(de);
  $("#check").parentNode.appendChild(hear);
  speak(de);
}
function next(){S.queue.shift(); S.idx++; S.locked=false; S.q=S.queue[0]||null; if(!S.q) renderDone(); else renderQ();}
function renderDone(){
  app.innerHTML=`<div class="card"><h2>${t("done")}</h2>
    <p class="lede">${mastered()} / 100 ${t("mastered")}</p>
    <div class="rowbtns"><button class="btn primary" id="again">${t("again")}</button>
    <button class="btn ghost" id="home">${t("mapBtn")}</button></div></div>`;
  $("#again").onclick=()=>startSession(true); $("#home").onclick=()=>go("home"); nav();
}
function renderAtlas(){
  app.innerHTML=`<header class="top"><div class="brand"><b>100</b><small>EN · ES · DE</small></div>${langs()}</header>
    <input class="search" id="q" placeholder="sein · eat · anrufen">
    <div id="list"></div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setUi(b.dataset.l));
  const draw=(f="")=>{
    f=f.trim().toLowerCase();
    const rows=V.map((v,i)=>({v,i})).filter(x=>!f||(x.v.inf+x.v.en+x.v.es+x.v.now[0]).toLowerCase().includes(f));
    $("#list").innerHTML=rows.map(({v,i})=>`
      <div class="item">
        <div style="display:flex;gap:8px;align-items:center">
          <b class="de" style="font-size:1.2rem;flex:1">${v.inf}</b>
          <span class="lvl ${LCLS(v.lvl)}">${v.lvl}</span>
          <span class="lvl A11">${mastery(v)}/4</span>
        </div>
        <div class="eshint">${v.en} · ${v.es}</div>
        <div class="tenses">
          <div><b>now</b> ${v.now[0]} <button type="button" class="speak" data-i="${i}" data-t="now">🔊</button></div>
          <div><b>past</b> ${v.past[0]} <button type="button" class="speak" data-i="${i}" data-t="past">🔊</button></div>
          <div><b>fut</b> ${v.fut[0]} <button type="button" class="speak" data-i="${i}" data-t="fut">🔊</button></div>
          <div class="eshint">ich ${v.ich} · du ${v.du} · er ${v.er} · ${v.pk==="pret"?"pret. "+v.pret:v.aux+" "+v.part}</div>
        </div>
      </div>`).join("");
    $("#list").onclick=e=>{
      const b=e.target.closest("[data-t]"); if(!b) return;
      const v=V[+b.dataset.i]; if(!v) return;
      speak(v[b.dataset.t][0]);
    };
  };
  draw(); $("#q").oninput=e=>draw(e.target.value); nav();
}
if(typeof speechSynthesis!=="undefined") speechSynthesis.onvoiceschanged=()=>{};
go("home");
</script>
</body>
</html>
