<style>
:root{
  --bg:#0B0D12; --ink:#F4F1EA; --muted:#8B93A7; --card:#161B24;
  --line:#2A3140; --gold:#E8B86D; --red:#E24A3B; --ok:#6DBF8B;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb img,.amb video{width:100%;height:100%;object-fit:cover;filter:brightness(.32) saturate(1.05)}
.ambdim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,18,.35),rgba(11,13,18,.88))}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px 110px;position:relative;z-index:1}
button,input{font:inherit;color:inherit} button{cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
.brand b{display:block;font-size:1.65rem;font-weight:700;letter-spacing:-.04em}
.brand small{color:var(--gold);font-size:.85rem}
.lede{color:var(--muted);margin:0 0 10px}
.scene{color:var(--gold);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
h2{margin:0 0 8px;font-size:1.08rem}
.de{font-weight:750;font-size:1.28rem;line-height:1.4}
.en{color:var(--muted);margin-top:6px}
.btn{border:0;border-radius:14px;padding:14px 16px;min-height:50px;font-weight:700;background:#1A1F2A;color:var(--ink);width:100%;text-align:center}
.btn.gold{background:var(--gold);color:#0B0D12}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.rowbtns{display:flex;flex-direction:column;gap:8px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#0B0D12;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{border:0;background:transparent;color:#6B7385;min-height:48px;border-radius:14px}
.nav button.on{color:var(--gold);background:rgba(232,184,109,.12)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pin{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:6px 0;
  border:1px solid transparent;border-radius:16px;background:transparent;color:var(--ink)}
.pin.here{border-color:var(--gold);background:rgba(232,184,109,.08)}
.pin.lock{opacity:.4}
.dot{width:10px;height:10px;border-radius:50%;background:#2A3140}
.pin.here .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.cover{width:100%;height:120px;object-fit:cover;border-radius:14px;margin:8px 0 12px;display:block}
.line{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;color:var(--ink)}
.line:last-child{border-bottom:0}
.w{display:inline-block;margin:0 5px 8px 0;padding:4px 2px;border-bottom:2px solid var(--gold);font-weight:750;font-size:1.35rem;background:transparent;color:var(--ink)}
.w.on{background:rgba(232,184,109,.16);border-radius:8px}
.gloss{background:#12151C;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;min-height:64px}
.chipbox{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chipbox .btn{width:auto;flex:1 1 28%;min-height:52px}
.ans{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#12151C;font-size:1.1rem;margin:10px 0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#141821;border-top:1px solid var(--gold);
  border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.sheet .de{font-size:1.45rem}
.lockscr{min-height:78vh;display:flex;flex-direction:column;justify-content:flex-end}
.lockscr h1{font-size:2.6rem;margin:0 0 8px;text-align:center;letter-spacing:-.05em}
body.login .nav{display:none}
.chip{display:inline-block;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--gold);font-size:.75rem;font-weight:700}
.ok{color:var(--ok)} .bad{color:var(--red)}
.speak{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#12151C;color:var(--gold);flex:0 0 40px}
.buckets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
</style>
</head>

function $(s,el=document){return el.querySelector(s);}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function tokens(s){return s.replace(/[¿?¡!.,]/g," ").split(/\s+/).filter(Boolean);}
function norm(s){return (s||"").toLowerCase().replace(/ß/g,"ss").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}

  V=DATA.verbs.map(v=>{

  });
}

async function sha(s){
  try{
    if(crypto.subtle){
      const b=new TextEncoder().encode(s);
      const d=await crypto.subtle.digest("SHA-256",b);
      return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0;
  return "x"+h;
}

function go(name){
  if(!who()){ renderLogin(); return; }
  document.body.classList.remove("login");
  if(name==="home"){ S.card=null; S.mode=null; }

  if(name==="home") renderHome();
  else if(name==="scene") renderScene();
  else if(name==="card") renderCard();
  else if(name==="practice") renderPractice();
  else if(name==="reviews") renderReviews();
  else if(name==="set") renderSet();
  else renderHome();
}

  return V.filter(v=>c.units.includes(v.u));
}

function wordInfo(w, v){
  const k=w.toLowerCase().replace(/[.,!?]/g,"");
  if(GLOSS[k]) return {de:w, en:GLOSS[k][0], es:GLOSS[k][1], tag:GLOSS[k][2]||"palabra"};
  const forms=["ich","du","er","wir","pret","part","inf"];
  if(v){
    if(norm(w)===norm(v.inf) || norm(w)===norm(v.ich) || norm(w)===norm(v.du) || norm(w)===norm(v.er) || norm(w)===norm(v.wir) || norm(w)===norm(v.pret))
      return {de:w, en:v.en, es:v.es, tag:"verbo · "+v.inf};
  }
  const hit=V.find(x=>[x.inf,x.ich,x.du,x.er,x.wir,x.pret].some(f=>norm(f)===norm(w)));
  if(hit) return {de:w, en:hit.en, es:hit.es, tag:"verbo · "+hit.inf};
  return {de:w, en:"", es:"toca Guardar si quieres repasarla", tag:"palabra"};
}

async function doLogin(create){
  const name=($("#user")&&$("#user").value||"").trim().toLowerCase();
  const pass=$("#pass")&&$("#pass").value||"";
  if(name.length<2||pass.length<4){alert("Nombre 2 letras. Contraseña 4+ — la inventas tú."); return;}
  const A=accts(); const h=await sha(pass);
  if(create){
    if(A[name]){alert("Ese nombre ya existe. Usa Ya tengo cuenta."); return;}
    A[name]={h,data:Object.assign(blank(),{user:name})};
  } else {
    if(!A[name]||A[name].h!==h){alert("Nombre o contraseña mal."); return;}
  }
  setAccts(A); localStorage.setItem(WHO,name);
  S=Object.assign(blank(), A[name].data||{}); S.user=name; save(); go("home");
}

      <input class="ans" id="pass" type="password" placeholder="Contraseña (tú la eliges, 4+)">
      <div class="rowbtns">
        <button class="btn red" id="up">Crear cuenta</button>
        <button class="btn ghost" id="in">Ya tengo cuenta</button>
      </div>
    </div>
  </div>`;
  $("#up").onclick=()=>doLogin(true);
  $("#in").onclick=()=>doLogin(false);
}

function renderHome(){
  const city=recCity();
  setAmb("img/night.mp4", true);
  const due=(S.reviews||[]).filter(r=>!r.due || r.due<=Date.now()).length;
  app.innerHTML=`<header class="top"><div class="brand"><b>Hoy</b><small>${who()} · ${S.reviews.length} guardadas</small></div></header>
    ${CITIES.map(c=>`<button class="pin ${c.id===city.id?"here":""} ${c.live?"":"lock"}" data-id="${c.id}" ${c.live?"":"disabled"}>
      <i class="dot"></i><span><b>${c.name}</b>${c.id===city.id?" · estás aquí":c.live?"":" · candado"}</span>
    </button>`).join("")}
    <div class="card">
      <p class="scene">${city.name}</p>
      <img class="cover" src="${city.img}" alt="">
      <h2>${city.scene}</h2>
      <p class="lede">${city.lede}</p>
      <div class="rowbtns">
        <button class="btn gold" id="goScene">Abrir la escena</button>
        <button class="btn ghost" id="goRev">${due?due+" por repasar":"Reviews"}</button>
      </div>
    </div>`;
  app.querySelectorAll(".pin").forEach(b=>b.onclick=()=>{
    const c=CITIES.find(x=>x.id===b.dataset.id); if(!c||!c.live) return;
    S.lastUnit=c.units[0]; save(); renderHome();
  });
  $("#goScene").onclick=()=>go("scene");
  $("#goRev").onclick=()=>go("reviews");
  nav();
}

function renderScene(){
  const city=recCity();
  const vs=sceneVerbs();
  setAmb(city.img,false);
  S.card=null;
  app.innerHTML=`<header class="top"><div class="brand"><b>${city.scene}</b></div><span class="chip">${city.name}</span></header>
    <p class="lede">${city.lede} Toca una frase. Como Seedlang: la oyes, la abres, la guardas.</p>
    <div class="card" id="list"></div>`;
  $("#list").innerHTML=vs.map((v,i)=>`
    <button class="line" data-i="${V.indexOf(v)}">
      <div style="flex:1">
        <div class="de" style="font-size:1.08rem">${esc(v.now[0])}</div>
        <div class="en">${esc(S.ui==="es"?v.es:v.enNow)}</div>
      </div>
      <span class="speak">🔊</span>
    </button>`).join("");
  $("#list").onclick=e=>{
    const sp=e.target.closest(".speak");
    const b=e.target.closest(".line"); if(!b) return;
    const v=V[+b.dataset.i];
    if(sp){ speak(v.now[0]); e.stopPropagation(); return; }
    openCard(v,"now");
  };
  nav();
}

function openCard(v, tense){
  S.card={inf:v.inf, tense:tense||"now"}; save();
  S.screen="card"; renderCard();
}
function currentV(){ return V.find(x=>x.inf===S.card.inf); }

function wordsHtml(de, v, active){
  return tokens(de).map((w,i)=>`<button class="w ${active===i?"on":""}" data-w="${esc(w)}" data-i="${i}">${esc(w)}</button>`).join(" ");
}

function renderCard(){
  const v=currentV(); if(!v){ go("scene"); return; }
  const tense=S.card.tense||"now";
  const de=deLine(v,tense), en=enLine(v,tense), es=esLine(v,tense);
  const city=cityOf(v.u);
  setAmb(city.img,false);
  app.innerHTML=`<header class="top"><div class="brand"><b>${city.scene}</b></div><span class="chip">${city.name}</span></header>
    <p class="lede">Toca cualquier palabra.</p>
    <div class="card">
      <div id="words">${wordsHtml(de,v,-1)}</div>
      <div class="gloss" id="gloss">Toca una palabra para verla.</div>
      <p class="en">${esc(S.ui==="de"?"": (S.ui==="es"?es:en))}</p>
      <div class="rowbtns" style="margin-top:12px">
        <button class="btn ghost" id="hear">🔊 Oír esta frase</button>
        <button class="btn gold" id="prac">Practicar esta</button>
        <button class="btn ghost" id="save">Guardar en Reviews</button>
        <button class="btn ghost" id="back">Todas las frases</button>
      </div>
    </div>`;
  bindWords(v);
  $("#hear").onclick=()=>speak(de);
  $("#prac").onclick=()=>pickPractice();
  $("#save").onclick=()=>{ saveReview(v,tense); $("#save").textContent="Guardada"; };
  $("#back").onclick=()=>go("scene");
  speak(de);
  nav();
}
function bindWords(v){
  $("#words").querySelectorAll(".w").forEach(b=>b.onclick=()=>{
    $("#words").querySelectorAll(".w").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    const info=wordInfo(b.dataset.w, v);
    $("#gloss").innerHTML=`<b>${esc(info.de)}</b> · ${esc(info.tag)}<div class="en">${esc(info.en)} · ${esc(info.es)}</div>`;
    speak(info.de);
  });
}

function pickPractice(){
  const v=currentV();
  app.innerHTML=`<header class="top"><div class="brand"><b>¿Cómo practicas?</b></div></header>
    <p class="lede">${esc(deLine(v,S.card.tense))} — tú eliges. Un modo, esta frase.</p>
    <div class="rowbtns">
      <button class="btn gold" data-m="chips">Armar palabras</button>
      <button class="btn ghost" data-m="say">Escribirla</button>
      <button class="btn ghost" data-m="art">der / die / das</button>
      <button class="btn ghost" id="cancel">Volver a la ficha</button>
    </div>`;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ S.mode=b.dataset.m; S.screen="practice"; renderPractice(); });
  $("#cancel").onclick=()=>renderCard();
  nav();
}

function renderPractice(){
  const v=currentV(); if(!v){ go("scene"); return; }
  const tense=S.card.tense||"now";
  const de=deLine(v,tense);
  const city=cityOf(v.u);
  setAmb(city.img,false);
  if(S.mode==="say"){
    app.innerHTML=`<p class="scene">${city.scene}</p>
      <p class="lede">${esc(S.ui==="es"?esLine(v,tense):enLine(v,tense))}</p>
      <input class="ans" id="ans" placeholder="Escríbela en alemán" autocapitalize="off">
      <button class="btn gold" id="check">Comprobar</button>`;
    $("#check").onclick=()=>{
      const ok=norm($("#ans").value)===norm(de);
      showSheet(v,tense,ok);
    };
    return nav();
  }
  if(S.mode==="art"){
    const keys=Object.keys(ART);
    const noun=keys[Math.floor(Math.random()*keys.length)];
    app.innerHTML=`<p class="scene">${city.scene} · artículo</p>
      <div class="card" style="text-align:center">
        <p class="de" style="font-size:2rem">${noun}</p>
        <div class="buckets">
          <button class="btn ghost" data-a="der">der</button>
          <button class="btn ghost" data-a="die">die</button>
          <button class="btn ghost" data-a="das">das</button>
        </div>
      </div>`;
    app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>showSheet(v,tense,b.dataset.a===ART[noun]));
    return nav();
  }
  // chips — Seedlang-like build, then sheet (never auto-skip)
  const need=tokens(de);
  const decoy=shuffle(["der","die","das","ein","nicht"]).slice(0,2);
  let got=[];
  app.innerHTML=`<p class="scene">${city.scene} · armar</p>
    <p class="lede">${esc(S.ui==="es"?esLine(v,tense):enLine(v,tense))}</p>
    <div class="card" id="built" style="min-height:52px">…</div>
    <div class="chipbox" id="box"></div>`;
  const box=$("#box");
  shuffle(need.concat(decoy)).forEach(w=>{
    const b=document.createElement("button"); b.className="btn ghost"; b.textContent=w;
    b.onclick=()=>{
      if(w===need[got.length]){
        got.push(w); b.remove(); $("#built").textContent=got.join(" ");
        if(got.length===need.length) showSheet(v,tense,true);
      } else { b.style.borderColor="var(--red)"; }
    };
    box.appendChild(b);
  });
  nav();
}

function saveReview(v,tense){
  S.reviews=S.reviews||[];
  const de=deLine(v,tense);
  if(S.reviews.some(r=>r.de===de)) return;
  S.reviews.unshift({de,en:enLine(v,tense),es:esLine(v,tense),inf:v.inf,tense,due:Date.now()});
  save();
}

function showSheet(v,tense,ok){
  const de=deLine(v,tense);
  S.screen="sheet";
  speak(de);
  const city=cityOf(v.u);
  const overlay=document.createElement("div");
  overlay.className="sheet";
  overlay.innerHTML=`<p class="scene">${ok?"Bien · fíjate":"Mírala otra vez"}</p>
    <div id="swords">${wordsHtml(de,v,-1)}</div>
    <div class="gloss" id="sgloss">Toca una palabra. El audio es de ESA frase.</div>
    <p class="en">${esc(enLine(v,tense))} · ${esc(esLine(v,tense))}</p>
    <div class="rowbtns" style="margin-top:12px">
      <button class="btn ghost" id="hear">🔊 Oír otra vez</button>
      <button class="btn ghost" id="save">Guardar en Reviews</button>
      <button class="btn gold" id="next">Continuar</button>
    </div>`;
  document.body.appendChild(overlay);
  const bind=()=>{
    overlay.querySelectorAll(".w").forEach(b=>b.onclick=()=>{
      overlay.querySelectorAll(".w").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      const info=wordInfo(b.dataset.w,v);
      $("#sgloss",overlay).innerHTML=`<b>${esc(info.de)}</b> · ${esc(info.tag)}<div class="en">${esc(info.en)} · ${esc(info.es)}</div>`;
      speak(info.de);
    });
  };
  bind();
  $("#hear",overlay).onclick=()=>speak(de);
  $("#save",overlay).onclick=()=>{ saveReview(v,tense); $("#save",overlay).textContent="Guardada"; };
  $("#next",overlay).onclick=()=>{ overlay.remove(); S.mode=null; go("scene"); };
}

function renderReviews(){
  setAmb("img/night.jpg",false);
  const list=S.reviews||[];
  app.innerHTML=`<header class="top"><div class="brand"><b>Reviews</b><small>${list.length} fichas</small></div></header>
    <p class="lede">Como Seedlang: lo que guardas vuelve aquí. Toca para oír y analizar.</p>
    <div class="card">
      <button class="btn gold" id="gender">Trainer · der / die / das</button>
    </div>
    <div class="card" id="list">${list.length?"":"Aún no hay nada. En una ficha: Guardar."}</div>`;
  if(list.length){
    $("#list").innerHTML=list.map((r,i)=>`<button class="line" data-i="${i}">
      <div style="flex:1"><div class="de" style="font-size:1.05rem">${esc(r.de)}</div><div class="en">${esc(r.en)}</div></div>
    </button>`).join("");
    $("#list").onclick=e=>{
      const b=e.target.closest(".line"); if(!b) return;
      const r=list[+b.dataset.i];
      const v=V.find(x=>x.inf===r.inf)||V[0];
      openCard(v, r.tense||"now");
    };
  }
  $("#gender").onclick=()=>{ S.card={inf:V[0].inf,tense:"now"}; S.mode="art"; S.screen="practice"; renderPractice(); };
  nav();
}

function renderSet(){
  setAmb("img/night.jpg",false);
  app.innerHTML=`<header class="top"><div class="brand"><b>Ajustes</b></div></header>
    <div class="card">
      <h2>Idioma de la app</h2>
      <div class="rowbtns">
        ${[["es","Español"],["en","English"],["de","Deutsch"]].map(([id,l])=>`<button class="btn ${S.ui===id?"gold":"ghost"}" data-u="${id}">${l}</button>`).join("")}
      </div>
      <p class="lede" style="margin-top:10px">Italiano y más se abren con la ciudad.</p>
    </div>
    <div class="card">
      <h2>Cuenta</h2>
      <p class="lede">${who()} · solo este iPhone</p>
      <button class="btn ghost" id="out">Salir</button>
    </div>`;
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{S.ui=b.dataset.u; save(); renderSet();});
  $("#out").onclick=logout;
  nav();
}

hydrate();
app=$("#app");
S=load();
if(!who()) renderLogin();
else go("home");
</script>
</body>
</html>
